<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helix</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" role="img" aria-label="Helix">
          <defs><linearGradient id="hxbg2" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#1b2740"/><stop offset="1" stop-color="#0e1626"/></linearGradient></defs>
          <rect width="32" height="32" rx="7.5" fill="url(#hxbg2)"/>
          <line x1="11.2" y1="11" x2="20.8" y2="11" stroke="#fff" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="11.2" y1="21" x2="20.8" y2="21" stroke="#fff" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M16 6C22 10 22 13 16 16C10 19 10 22 16 26" stroke="#e5484d" stroke-width="2.3" stroke-linecap="round"/>
          <path d="M16 6C10 10 10 13 16 16C22 19 22 22 16 26" stroke="#3b82f6" stroke-width="2.3" stroke-linecap="round"/>
        </svg>
        <span class="brand-text"><span class="brand-name">Helix<span class="brand-tag">v0.1</span></span><small>공격·방어 자동 관제</small></span>
        <button class="sidebar-close" id="sidebar-close" aria-label="메뉴 닫기">✕</button>
      </div>
      <nav class="nav" id="nav" aria-label="주 메뉴"></nav>
      <div class="sidebar-foot">
        <span class="mono" id="conn-dot"></span>
        <span id="conn-text" class="mono">연결 확인 중</span>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <main class="main">
      <header class="topbar" id="topbar">
        <button class="nav-toggle" id="nav-toggle" aria-label="메뉴" aria-expanded="false">≡</button>
        <div class="topbar-title" id="page-title">보안 현황</div>
        <div class="topbar-status" id="run-status"><div class="sbar"><span class="sbar-state"><span class="sbar-dot"></span>연결 확인 중</span></div></div>
      </header>
      <div class="view" id="view"></div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
