<!doctype html>
<meta charset="utf-8">
<title>택티컬 공수 콘솔</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* 레이아웃: 좌측 고정 네비 + 상단 런 컨텍스트 바 + 밀집 대시보드 뷰 영역. 다크 단일 테마(보안 콘솔). */
:root{
  color-scheme: dark;
  --bg:#0A0C10; --bg-2:#07080B; --surface:#111419; --surface-2:#171B22; --surface-3:#1F252E;
  --border:#232A33; --border-strong:#333C48;
  --fg:#E9EDF3; --fg-muted:#8A95A3; --fg-dim:#5A6573;
  /* 색상 코드(다이어그램 패밀리와 통일) */
  --attack:#FF6B6B; --attack-strong:#F43F3F; --attack-bg:rgba(244,63,63,.1); --attack-line:rgba(244,63,63,.42);
  --defense:#54A0FF; --defense-strong:#2E86F0; --defense-bg:rgba(46,134,240,.1); --defense-line:rgba(46,134,240,.42);
  --system:#8A95A3; --system-bg:rgba(138,149,163,.09); --system-line:rgba(138,149,163,.35);
  --flag:#FFC247; --flag-strong:#F5A623; --flag-bg:rgba(245,166,35,.12);
  /* 판정 */
  --v-blocked:#2ED38A; --v-blocked-bg:rgba(46,211,138,.12);
  --v-fake:#F5A623; --v-fake-bg:rgba(245,166,35,.12);
  --v-notblocked:#F43F3F; --v-notblocked-bg:rgba(244,63,63,.12);
  --v-inconclusive:#6B7686; --v-inconclusive-bg:rgba(107,118,134,.14);
  /* UI 액센트(의미색과 구분되는 시안) */
  --accent:#2BD4C0; --accent-bg:rgba(43,212,192,.12); --go:#2ED38A; --go-bg:rgba(46,211,138,.13);
  --r:6px; --r-sm:4px; --r-xs:3px;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --shadow:0 0 0 1px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:rgba(43,212,192,.3)}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}

/* ---- app shell ---- */
.app{display:grid;grid-template-columns:250px 1fr;height:100%}
.sidebar{background:var(--bg-2);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow-y:auto;
  padding-left:env(safe-area-inset-left,0px)}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--attack-strong),var(--defense-strong));display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.brand .logo svg{width:19px;height:19px}
.brand .t{font-weight:700;font-size:15px;letter-spacing:-.02em;line-height:1.15}
.brand .s{font-size:11px;color:var(--fg-dim);letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px}
.nav .lbl{font-size:10.5px;letter-spacing:.09em;color:var(--fg-dim);text-transform:uppercase;padding:12px 10px 5px;font-weight:600}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:var(--r-sm);color:var(--fg-muted);font-weight:500;font-size:13.5px;position:relative;transition:background .14s,color .14s}
.nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav a:hover{background:var(--surface);color:var(--fg)}
.nav a.on{background:var(--accent-bg);color:var(--fg)}
.nav a.on svg{opacity:1;color:var(--accent)}
.nav a.on::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.side-foot{margin-top:auto;padding:12px 14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:9px}
.proto{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--fg-dim);background:var(--surface);border:1px dashed var(--border-strong);padding:6px 9px;border-radius:999px;align-self:flex-start}
.proto .dot{width:6px;height:6px;border-radius:50%;background:var(--flag)}

.main{min-width:0;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:11px max(18px,env(safe-area-inset-right,0px)) 11px 18px;
  background:var(--bg-2);border-bottom:1px solid var(--border)}
.tb-ctx{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.runchip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:5px 11px;font-size:12.5px}
.runchip .live{width:7px;height:7px;border-radius:50%;background:var(--go);box-shadow:0 0 0 0 rgba(34,197,94,.55);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.ctx-sep{width:1px;height:16px;background:var(--border-strong)}
.ctx-item{font-size:12.5px;color:var(--fg-muted);white-space:nowrap}
.ctx-item b{color:var(--fg);font-weight:600}
.tb-sp{flex:1 1 auto}
.tb-actions{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:var(--r-sm);font-size:12.5px;font-weight:600;cursor:pointer;transition:background .14s,border-color .14s}
.btn svg{width:15px;height:15px}
.btn:hover{background:var(--surface-2);border-color:#47577a}
.btn.go{background:var(--go-bg);border-color:rgba(34,197,94,.4);color:#86efac}
.btn.go:hover{background:rgba(34,197,94,.24)}
.btn.danger{background:var(--attack-bg);border-color:rgba(239,68,68,.4);color:#fca5a5}
.btn.danger:hover{background:rgba(239,68,68,.24)}
.btn.sm{padding:5px 10px;font-size:12px}

.view{flex:1 1 auto;min-height:0;overflow-y:auto;
  padding:22px max(18px,env(safe-area-inset-right,0px)) 40px max(18px,env(safe-area-inset-left,0px))}
.view-in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head h1{font-size:21px}
.page-head .sub{color:var(--fg-muted);font-size:13px;margin-top:3px}

/* ---- primitives ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card.pad{padding:17px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 17px;border-bottom:1px solid var(--border)}
.card-h h3{font-size:14px}
.card-h .hint{font-size:11.5px;color:var(--fg-dim)}
.card-b{padding:17px}
.grid{display:grid;gap:14px}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:14px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}

.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px 16px;display:flex;flex-direction:column;gap:7px;min-width:0}
.tile .k{font-size:11.5px;color:var(--fg-muted);font-weight:500;display:flex;align-items:center;gap:6px}
.tile .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1}
.tile .m{font-size:11.5px;color:var(--fg-dim)}
.tile.lead{border-left:3px solid var(--accent)}
.swatch{width:9px;height:9px;border-radius:3px;flex:none}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:3px;border:1px solid transparent;white-space:nowrap;letter-spacing:.01em}
.pill .d{width:6px;height:6px;border-radius:50%}
.p-attack{background:var(--attack-bg);color:var(--attack);border-color:rgba(239,68,68,.3)}
.p-defense{background:var(--defense-bg);color:var(--defense);border-color:rgba(59,130,246,.3)}
.p-system{background:var(--system-bg);color:var(--fg-muted);border-color:rgba(148,163,184,.3)}
.p-flag{background:var(--flag-bg);color:var(--flag);border-color:rgba(245,158,11,.3)}
.p-ok{background:var(--v-blocked-bg);color:var(--v-blocked);border-color:rgba(34,197,94,.3)}
.p-blocked{background:var(--v-blocked-bg);color:var(--v-blocked);border-color:rgba(34,197,94,.3)}
.p-fake{background:var(--v-fake-bg);color:var(--v-fake);border-color:rgba(245,158,11,.3)}
.p-notblocked{background:var(--v-notblocked-bg);color:var(--v-notblocked);border-color:rgba(239,68,68,.3)}
.p-inconclusive{background:var(--v-inconclusive-bg);color:var(--v-inconclusive);border-color:rgba(124,138,165,.3)}
.p-live{background:var(--go-bg);color:#86efac;border-color:rgba(34,197,94,.3)}

.term{border-bottom:1px dotted var(--fg-dim);cursor:help}

/* ---- loop stepper (0~8) ---- */
.loop{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.loop .step{flex:1 0 auto;min-width:74px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 10px;position:relative}
.loop .step .n{font-size:10.5px;color:var(--fg-dim);font-weight:700;font-family:var(--mono)}
.loop .step .l{font-size:11px;margin-top:2px;color:var(--fg-muted);font-weight:500}
.loop .step.done{border-color:var(--defense-line)}
.loop .step.done .l{color:var(--fg)}
.loop .step.now{background:var(--accent-bg);border-color:var(--accent)}
.loop .step.now .l{color:var(--fg);font-weight:600}
.loop .step.now .n{color:var(--accent)}

/* ---- turn budget bars ---- */
.budget{display:flex;flex-direction:column;gap:5px}
.budget .top{display:flex;justify-content:space-between;font-size:12px}
.bar{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px}
.bar.attack>i{background:linear-gradient(90deg,var(--attack-strong),var(--attack))}
.bar.defense>i{background:linear-gradient(90deg,var(--defense-strong),var(--defense))}

/* ---- flag chain ---- */
.chain{display:flex;gap:9px;flex-wrap:wrap}
.flagnode{flex:1 1 150px;min-width:140px;border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 12px;background:var(--surface-2);position:relative;opacity:.55}
.flagnode .id{font-size:16px;font-weight:700;color:var(--fg-dim)}
.flagnode .nm{font-size:12.5px;font-weight:600;margin-top:2px}
.flagnode .sub{font-size:11px;color:var(--fg-muted);margin-top:1px}
.flagnode .mi{font-family:var(--mono);font-size:10.5px;color:var(--fg-dim);margin-top:6px}
.flagnode.hit{opacity:1;border-color:var(--flag);background:linear-gradient(180deg,var(--flag-bg),var(--surface-2))}
.flagnode.hit .id{color:var(--flag)}

/* ---- 크라운(지정 중요자산 반출) — 접근기록 판정 ---- */
.crownwrap{display:flex;flex-direction:column;gap:10px}
.crownnodes{display:flex;gap:9px;flex-wrap:wrap}
.crownnode{flex:1 1 160px;min-width:150px;display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 12px;background:var(--surface-2);opacity:.6;transition:opacity .14s,border-color .14s}
.crownnode .cic{display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:7px;background:var(--surface-3);color:var(--fg-dim)}
.crownnode .cic svg{width:16px;height:16px}
.crownnode .cmeta{display:flex;flex-direction:column;min-width:0;flex:1}
.crownnode .cnm{font-size:12.5px;font-weight:600}
.crownnode .csub{font-size:10.5px;color:var(--fg-muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crownnode .cst{font-size:11px;font-weight:700;color:var(--fg-dim);white-space:nowrap}
.crownnode.exfil{opacity:1;border-color:var(--attack);background:linear-gradient(180deg,var(--attack-bg),var(--surface-2))}
.crownnode.exfil .cic{background:var(--attack-bg);color:var(--attack)}
.crownnode.exfil .cst{color:var(--attack)}
.crownnode .chrow{display:flex;align-items:center;gap:4px;margin-top:5px;font-size:10px;color:var(--fg-dim)}
.chtag{display:inline-flex;align-items:center;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:600;background:var(--surface-3);color:var(--fg-muted);border:1px solid var(--border)}
.chtag.app{color:var(--accent);border-color:var(--accent-bg)}
.chtag.db{color:var(--flag);border-color:var(--flag-bg)}
.crownverdict{display:flex;align-items:center;gap:9px;flex-wrap:wrap;border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface-2)}
.crownverdict .cvdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--fg-dim)}
.crownverdict .cvt{font-size:12.5px;font-weight:700;color:var(--fg-muted)}
.crownverdict .cvwhy{font-size:11px;color:var(--fg-dim)}
.crownverdict.breached{border-color:var(--attack);background:var(--attack-bg)}
.crownverdict.breached .cvdot{background:var(--attack);box-shadow:0 0 0 3px var(--attack-bg)}
.crownverdict.breached .cvt{color:var(--attack)}
.crownverdict.safe{border-color:var(--v-blocked);background:var(--v-blocked-bg)}
.crownverdict.safe .cvdot{background:var(--v-blocked)}
.crownverdict.safe .cvt{color:var(--v-blocked)}

/* ---- activity timeline ---- */
.tabs{display:inline-flex;gap:3px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:3px}
.tabs button{border:0;background:transparent;color:var(--fg-muted);font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:6px;cursor:pointer}
.tabs button.on{background:var(--surface-3);color:var(--fg)}
.stream{display:flex;flex-direction:column;gap:8px}
.rounddiv{display:flex;align-items:center;gap:10px;margin:6px 0 2px}
.rounddiv .ln{flex:1;height:1px;background:var(--border)}
.rounddiv .rl{font-size:11px;color:var(--fg-dim);font-weight:600;letter-spacing:.04em;white-space:nowrap}
details.ev{border:1px solid var(--border);border-left-width:3px;border-radius:var(--r-sm);background:var(--surface);overflow:hidden}
details.ev[data-t=attack]{border-left-color:var(--attack-strong)}
details.ev[data-t=defense]{border-left-color:var(--defense-strong)}
details.ev[data-t=verify]{border-left-color:var(--system)}
details.ev>summary{list-style:none;cursor:pointer;padding:11px 13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
details.ev>summary::-webkit-details-marker{display:none}
.ev .chev{width:15px;height:15px;color:var(--fg-dim);transition:transform .18s;flex:none}
details.ev[open] .chev{transform:rotate(90deg)}
.ev .cmd{font-family:var(--mono);font-size:12.5px;color:var(--fg);min-width:0;overflow-wrap:anywhere}
.ev .evnote{font-size:12px;color:var(--fg-muted);margin-left:auto;white-space:nowrap}
.ev .body{padding:0 13px 13px 38px;display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--border);padding-top:11px;margin-top:0}
.kv{display:grid;grid-template-columns:76px 1fr;gap:4px 12px;font-size:12.5px}
.kv .k{color:var(--fg-dim)}
.kv .v{color:var(--fg);overflow-wrap:anywhere}
.kv .v.m{font-family:var(--mono);font-size:12px}

/* ---- command log table ---- */
.tbl-wrap{overflow-x:auto}
table.log{width:100%;border-collapse:collapse;font-size:12.5px;min-width:620px}
table.log th{text-align:left;font-size:11px;color:var(--fg-dim);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:8px 12px;border-bottom:1px solid var(--border)}
table.log td{padding:9px 12px;border-bottom:1px solid var(--border)}
table.log tr:last-child td{border-bottom:0}
table.log td.c{font-family:var(--mono);font-size:12px;color:var(--fg)}
table.log tbody tr:hover{background:var(--surface-2)}
.actor{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:11.5px}
.actor.a{color:var(--attack)} .actor.d{color:var(--defense)}
.res{font-weight:600;font-size:11.5px}
.res.ok{color:var(--v-blocked)} .res.fail{color:var(--fg-dim)} .res.block{color:var(--flag)} .res.run{color:var(--accent)}

/* ---- god-view compare ---- */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.compare>div{padding:15px}
.compare .truth{background:linear-gradient(180deg,rgba(148,163,184,.06),transparent)}
.compare .dpanel{border-left:1px solid var(--border);background:linear-gradient(180deg,var(--defense-bg),transparent)}
.compare h4{font-size:12.5px;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.compare h4 svg,.card-h h3 svg{width:15px;height:15px;flex:none}
.mlist{display:flex;flex-direction:column;gap:6px}
.mitem{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:6px 9px;border-radius:var(--r-xs);background:var(--surface-2)}
.mitem .tag{font-family:var(--mono);font-size:11px;color:var(--fg-muted)}
.mitem .mk{margin-left:auto;font-size:11px;font-weight:600}
.mk.tp{color:var(--v-blocked)} .mk.fn{color:var(--attack)} .mk.fp{color:var(--v-fake)}

/* ---- replay verdict ---- */
.replay{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.phase{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);padding:8px 12px;border-radius:var(--r-sm)}
.phase .ph{font-weight:600;font-family:var(--mono);font-size:12px;color:var(--fg-muted)}
.arrow{color:var(--fg-dim)}

/* ---- MITRE heatmap ---- */
.heat{display:grid;grid-template-columns:1.6fr repeat(2,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden}
.heat>div{background:var(--surface);padding:9px 11px;font-size:12px;display:flex;align-items:center}
.heat .hh{background:var(--surface-2);font-size:11px;color:var(--fg-dim);font-weight:600;justify-content:center}
.heat .hl{flex-direction:column;align-items:flex-start;gap:1px}
.heat .hl .id{font-family:var(--mono);font-size:11px;color:var(--fg-dim)}
.heat .cell{justify-content:center;font-weight:600;font-family:var(--mono);font-size:12px}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:8px 16px}
.legend .li{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--fg-muted)}

/* form */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--fg-muted);font-weight:500}
.field input,.field select{background:var(--bg-2);border:1px solid var(--border-strong);color:var(--fg);border-radius:var(--r-sm);padding:9px 11px;font-size:13px;font-family:inherit}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r-sm);overflow:hidden}
.seg button{border:0;background:var(--bg-2);color:var(--fg-muted);padding:9px 14px;font-size:12.5px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--accent-bg);color:var(--fg)}

.muted{color:var(--fg-muted)}
.dim{color:var(--fg-dim)}
.chart-box{position:relative;height:260px}
.chart-box.sm{height:200px}
hr.sep{border:0;border-top:1px solid var(--border);margin:2px 0}

/* report */
.report-head{background:linear-gradient(135deg,rgba(239,68,68,.1),rgba(59,130,246,.1));border:1px solid var(--border);border-radius:var(--r);padding:22px}
.lede{font-size:16px;line-height:1.7;color:var(--fg)}
.lede b{font-weight:700}
.story{display:flex;flex-direction:column;gap:10px}
.storystep{display:flex;gap:13px;align-items:flex-start}
.storystep .badge{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;font-weight:700;background:var(--flag-bg);color:var(--flag);border:1px solid rgba(245,158,11,.3)}
.storystep .txt b{font-weight:600}
.storystep .txt .d{font-size:12.5px;color:var(--fg-muted);margin-top:2px}
details.deep>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 17px;font-weight:600}
details.deep>summary::-webkit-details-marker{display:none}
details.deep{border:1px solid var(--border-strong);border-radius:var(--r);background:var(--surface)}
details.deep .chev{width:16px;height:16px;transition:transform .18s;color:var(--fg-dim)}
details.deep[open] .chev{transform:rotate(90deg)}
.deepbadge{font-size:11px;color:var(--fg-dim);background:var(--surface-2);border:1px solid var(--border);padding:2px 8px;border-radius:999px;margin-left:auto;font-weight:500}
.caption{font-size:12px;color:var(--fg-muted);margin-top:9px;padding:9px 11px;background:var(--surface-2);border-radius:var(--r-sm);border-left:2px solid var(--accent)}

/* responsive */
@media (max-width:980px){ .g-4{grid-template-columns:repeat(2,1fr)} .g-3{grid-template-columns:1fr 1fr} }
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .sidebar{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--border);align-items:center;gap:2px;padding:6px 10px}
  .brand{padding:6px 8px 6px 2px} .brand .s{display:none}
  .nav{flex-direction:row;padding:0;gap:2px}
  .nav .lbl,.side-foot{display:none}
  .nav a{padding:8px 10px;font-size:0}
  .nav a svg{width:20px;height:20px} .nav a.on::before{display:none}
  .nav a.on{font-size:0}
  .g-2,.g-3,.g-4,.compare{grid-template-columns:1fr}
  .compare .dpanel{border-left:0;border-top:1px solid var(--border)}
  .chart-box{height:230px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

   rec.patch_applied?`④ 패처 — 패치 적용, 원자적 → 헬스체크 ${rec.healthcheck_passed?'✓':'✗'}`:'④ 패처 — 적용할 패치 없음'];

 const _god=_stages.length?_stages.map(s=>`<span class="pill p-flag">${'①②③'.charAt(s-1)||('#'+s)} 도달 · ${STAGE_TECH[s]||''}</span>`).join(''):'<span class="dim">god-view 도달 단계 없음</span>';
 const _flagStr=(rec.flags_reached_cum||[]).filter(f=>/^[0-9]+$/.test(String(f))).map(f=>'①②③'.charAt(+f-1)||('#'+f)).join('')||'—';
 const _crowns=(rec.crowns_reached_cum||[]);            // 반출된 크라운 objective id(접근기록)

 const _breached=_goals.includes(CROWN_GOAL);           // 중요자산 실제 침해 성립
 const _crownCh=(rec.crowns_by_channel_cum||{});
 const _crownGod=_crowns.length?_crowns.map(id=>{const c=CROWNS.find(x=>x.id===id)||{name:id,mitre:''};const chs=(_crownCh[id]||[]).map(ch=>CHAN_KO[ch]||ch).join('·');return `<span class="pill p-attack"><span class="d" style="background:var(--attack)"></span>${c.name} 반출${chs?' ['+chs+']':''} · ${c.mitre}</span>`;}).join(''):'<span class="dim">중요자산 반출 없음</span>';
 const _attained=_breached||_crowns.length>0||(rec.flags_reached_cum||[]).some(f=>String(f)==='4');
 return `<div class="view-in">
  <div class="page-head"><div><h1>라운드 뷰 · <span class="mono">Ep.${ep} / R${rnd}</span></h1><div class="sub">한 라운드를 가장 깊이 — 공격 추론 트레이스, 방어 파이프라인, 검증 판정까지.</div></div>
   ${vcode&&VERDICT[vcode]?vpill(vcode):'<span class="dim">판정 대기</span>'}</div>

  <div class="grid g-2">

    <div class="card-b"><div class="stream">${_atkHtml}</div></div>
   </div>
   <div class="card">

    <div class="card-b" style="display:flex;flex-direction:column;gap:9px">
     ${_pipe.map((s,i)=>`<div style="display:flex;gap:11px;align-items:flex-start;padding:10px 12px;background:var(--surface-2);border-radius:var(--r-sm)"><span class="mono" style="color:var(--defense);font-weight:700;font-size:12px">${i+1}</span><span style="font-size:12.5px">${s}</span></div>`).join('')}

   <div class="card-b" style="display:flex;flex-direction:column;gap:14px">

     <span class="phase"><span class="ph">이번 라운드 실공격</span><span class="res ${_attained?'ok':'fail'}">${_attained?'성공 · 중요자산 반출':'중요자산 미도달'}</span></span><span class="arrow">→</span>

    <p class="muted" style="font-size:12.5px;margin:0">${skipped?'이 라운드는 공격이 중요자산에 닿지 못해 방어·검증이 돌지 않았습니다(게이팅).':'패치된 라이브에 같은 대본을 재생해 <b>크라운 미반출 → <span style="color:var(--v-blocked)">진짜 차단</span></b>, 여전히 빠지면 <b style="color:var(--v-fake)">막은 척</b>, 재생이 비면 <b style="color:var(--v-inconclusive)">확인 불가</b>.'}</p>

  <div class="card">

 </div>`;

 const tl2=[]; cur.forEach(rec=>{evFromRound(rec).forEach(e=>tl2.push(e));}); TIMELINE=tl2;
 CMDLOG=cur.map(rec=>({r:rec.round,actor:'attack',cmd:rec.attack_summary||'(요약 없음)',res:ARES[rec.attack_end_reason]||rec.attack_end_reason}))
   .concat(cur.filter(r=>r.defense_end_reason!=='skipped').map(rec=>({r:rec.round,actor:'defense',cmd:(rec.patch_applied?'패치 적용':'무행동')+((rec.reported_techniques||[]).length?' · 탐지 '+rec.reported_techniques.join(','):''),res:rec.patch_applied?'ok':'noop'})))
   .sort((a,b)=>a.r-b.r);
 let n=0; for(let i=cur.length-1;i>=0;i--){if(cur[i].verdict==='blocked')n++;else break;} RUN.streak={side:'방어',n:n};
 const all=ROUNDS.slice().sort((a,b)=>(a.episode-b.episode)||(a.round-b.round));
 const rl=[],atk=[],dfn=[],dep=[],tp=[],fp=[],fn=[]; let ca=0,cd=0;
 all.forEach((rec,i)=>{if(rec.verdict==='fake_patch'||rec.verdict==='not_blocked')ca++;if(rec.verdict==='blocked')cd++;
  rl.push(i+1);atk.push(Math.round(ca/(i+1)*100));dfn.push(Math.round(cd/(i+1)*100));
  dep.push((rec.stages_reached&&rec.stages_reached.length)?Math.max.apply(null,rec.stages_reached):0);
  const d=rec.detection_cum||{};tp.push(d.tp||0);fp.push(d.fp||0);fn.push(d.fn||0);});
 EVO={rounds:rl,attack:atk,defense:dfn}; DEPTH=dep; DETECT={rounds:rl.map(String),tp:tp,fp:fp,fn:fn};
 const vc={BLOCKED:0,FAKE_PATCH:0,NOT_BLOCKED:0,INCONCLUSIVE:0}; all.forEach(r=>{const k=VKEY(r.verdict);if(k in vc)vc[k]++;}); VCOUNT=vc;
 const mu={},md={}; all.forEach(rec=>{(rec.stages_reached||[]).forEach(s=>{const t=STAGE_TECH[s];if(t)mu[t]=(mu[t]||0)+1;});(rec.reported_techniques||[]).forEach(t=>{const b=String(t).split('.')[0];md[b]=(md[b]||0)+1;});});
 MITRE=MITRE.map(m=>({id:m.id,name:m.name,use:mu[m.id]||0,det:md[m.id]||0}));
 const oc={}; EPISODES_DATA.forEach(s=>{const k=END_KO[s.end_reason]||s.end_reason;oc[k]=(oc[k]||0)+1;}); OUTCOME=oc;
 const eps=EPISODES_DATA.map(s=>({id:s.episode,rounds:s.rounds,depth:s.max_flag_depth,end:END_KO[s.end_reason]||s.end_reason,v:mapV(s.verdict_counts),avail:(s.availability!=null?Math.round(s.availability*100)+'%':'—'),mttd:((s.mttd&&s.mttd.mean_rounds!=null)?s.mttd.mean_rounds+'R':'—')}));
 if(curEp&&cur.length&&!eps.some(e=>e.id===curEp)){
  let depth=0; cur.forEach(r=>{(r.stages_reached||[]).forEach(s=>{if(s>depth)depth=s;});});
  const v={}; cur.forEach(r=>{const k=VKEY(r.verdict);v[k]=(v[k]||0)+1;});
  eps.push({id:curEp,rounds:cur.length,depth:depth,end:(LIVE.status==='running'?'진행 중':(END_KO[LIVE.status]||'—')),v:v,avail:'—',mttd:'—',cur:true});
 }
 EPISODES=eps;
}

async function poll(){
 // 엔드포인트별 독립 갱신(allSettled): 하나가 죽어도(예: 구버전 서버의 /api/status 404)
 // 나머지로 분석·교전탐색이 계속 갱신된다. 전부 실패할 때만 오프라인(목업)으로 떨어진다.
 const [st,rs,rd,ep,rn]=await Promise.allSettled([api('/api/status'),api('/api/run/status'),api('/api/rounds'),api('/api/episodes'),api('/api/runs')]);
 let any=false;
 if(st.status==='fulfilled'){LIVE=st.value;any=true;}
 if(rs.status==='fulfilled'){RUNSTATUS=rs.value;any=true;}
 if(rd.status==='fulfilled'){ROUNDS=Array.isArray(rd.value)?rd.value:[];any=true;}
 if(ep.status==='fulfilled'){EPISODES_DATA=Array.isArray(ep.value)?ep.value:[];any=true;}
 if(rn.status==='fulfilled'){RUNS_DATA=Array.isArray(rn.value)?rn.value:[];any=true;}  // 구버전 서버면 404 → 무시
 if(any){ ONLINE=true; _firstFail=true; try{recompute();rerender();}catch(e){/* 렌더 실패가 폴링을 멈추면 안 됨 */} }
 else if(ONLINE||_firstFail){ ONLINE=false; _firstFail=false; rerender(); }
}
function rerender(){
 renderCtx();
 const h=(location.hash||'#home').slice(1);
 const s=[ONLINE,LIVE.status,LIVE.episode,LIVE.round,LIVE.phase,LIVE.active,ROUNDS.length,EPISODES_DATA.length].join('|');
 // 모든 뷰를 시그니처 변화 시에만 재렌더(라이브 뷰 포함) — 매 poll 통째 재빌드로 인한
 // 스크롤 튐·깜빡임 제거. 턴 예산 바는 tickLive 가 1초마다 DOM 만 surgically 갱신한다.
 if(s!==_sig){ _sig=s; router(true); }
}
function tickLive(){
 if((location.hash||'')!=='#live')return;
 const L=LIVE||{}; if(!L.turn_started||!L.active)return;
 const tl=L.time_limit_sec||600; const el=Math.min(tl,Date.now()/1000-L.turn_started);
 const which=L.active==='attacker'?'a':'d';
 const bar=document.getElementById('bar-'+which), txt=document.getElementById('el-'+which);
 if(bar)bar.style.width=Math.round(el/tl*100)+'%';
 if(txt)txt.textContent=Math.floor(el)+' / '+tl+'초';
}
async function startRun(){
 const g=id=>{const el=document.getElementById(id);return el?el.value:undefined;};
 const body={episodes:parseInt(g('f-eps'),10)||1,max_rounds:parseInt(g('f-mr'),10)||1,time_limit:parseInt(g('f-tl'),10)||180,max_tokens:parseInt(g('f-mt'),10)||1024,fresh:true};
 try{const r=await api('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});toast('실험 시작됨'+(r.pid?(' (pid '+r.pid+')'):''));location.hash='#live';}
 catch(e){toast('시작 실패 — 오케스트레이터(VM C)에 연결할 수 없습니다. (이 미리보기는 백엔드가 없습니다)');}
 poll();
}
async function stopRun(){try{await api('/api/run/stop',{method:'POST'});toast('중지 요청됨');}catch(e){toast('중지 실패 — 백엔드에 연결할 수 없습니다.');}poll();}

/* ============ router ============ */
function router(preserveScroll){
 destroyCharts();
 let h=(location.hash||'#home').slice(1);
 if(!ROUTES[h])h='home';
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===h));
 const v=document.getElementById('view');
 const sc=v.scrollTop;
 v.innerHTML=ROUTES[h].html();
 v.scrollTop=preserveScroll?sc:0;
 if(ROUTES[h].mount)ROUTES[h].mount();
}
window.addEventListener('hashchange',function(){router(false);});
buildChrome();
renderCtx();
router(false);
poll();
setInterval(poll,2500);
setInterval(tickLive,1000);
</script>
