# 설정 템플릿. 실제 값은 이 파일을 config.yaml로 복사해서 채운다.
# config.yaml 은 .gitignore 되어 커밋되지 않는다 (DGX 주소·IP·토큰 등 민감정보).

# ===== GPU 서버 (LLM 서빙 — 공격/방어 역할별 분리) =====
dgx:
  attacker_host: "ATTACKER_GPU_IP"   # 공격 모델 서빙 서버 (부하 분산 위해 방어와 분리)
  defender_host: "DEFENDER_GPU_IP"   # 방어 모델 서빙 서버
  port: 11434                        # Ollama 기본 포트 (두 서버 공통)
  attacker_model: "<uncensored-model>"   # 탈옥 모델 (공격자)
  defender_model: "<aligned-model>"      # 일반 모델 (방어자)
  temperature: 0                     # 재현성 위해 0 고정
  # 단일 LLM 호출 HTTP 타임아웃(초). 비우면 턴 예산(experiment.time_limit_sec)을 그대로 씀.
  # 로컬 모델은 느리고 Ollama 첫 호출은 모델 로딩까지 겹쳐 기본 120초를 쉽게 넘김 → ReadTimeout.
  # 팁: 실행 전 `ollama run <model>` 로 모델을 미리 띄워두면(웜업) 첫 호출도 빨라짐.
  # request_timeout_sec: 300
  # LLM 생성 토큰 상한(비우면 무제한). 응답이 장황해 느리면 1024~2048 로 제한해 호출을 단축.
  # max_tokens: 2048

# ===== 네트워크 (관리망 기준 에이전트 주소) =====
network:
  attacker_url: "http://VM_A_MGMT_IP:8000"   # 공격 하네스
  defender_url: "http://VM_B_MGMT_IP:8000"   # 방어 하네스
  shared_token: "CHANGE_ME"                  # 관리망 통신용 공유 토큰

# ===== 대상 클러스터 (VM B) =====
target:
  attack_endpoint: "VM_B_ATTACK_IP"   # 공격망에서 본 대상 (발판용; exec_mode=true면 무시됨)
  kubeconfig: "/path/to/kubeconfig"   # VM C가 god-view 조회용

# ===== 공격자 실행 위치 (발판 = '웹 계층 침해') =====
# exec_mode=true면 공격 명령을 frontend ns 발판 파드 안에서 kubectl exec 로 '투명하게' 실행한다.
# → 공격자가 internal-wiki·postgres 등 .svc.cluster.local 내부 서비스에 도달(킬체인 ①③④).
# 끄면(기본 false) VM A 로컬 subprocess(외부에서 NodePort만 — 내부 킬체인엔 도달 불가).
# 사전작업: k8s/killchain/00-attacker-foothold.yaml 적용 + gen-foothold-kubeconfig.sh 로 만든
#          kubeconfig 를 VM A 에 두고 아래 경로 지정 → clean-baseline 재스냅샷.
attack:
  exec_mode: false
  exec_kubeconfig: "/home/vm-a/foothold.kubeconfig"   # frontend exec 전용(secret-read 없음)
  exec_namespace: "frontend"
  exec_pod: "deploy/attacker-foothold"
  # ── 병렬 워커(ARTEX식) ──
  # single(기본): 단일 ReAct 루프. parallel: 플래너(정렬 모델, dgx.defender_*)가 의도를
  # 뿌리고 워커 N개(탈옥 모델, dgx.attacker_*)가 claim해 ReAct·정착. 탈옥 모델 1개를
  # 워커들이 공유하므로 n_workers는 2~3 권장(그 이상은 decode 경합만 커짐).
  mode: "single"               # single | parallel
  n_workers: 2
  intent_budget_sec: 120       # 의도 하나당 ReAct 시간 예산
  intent_max_steps: 20
  max_waves: 6                 # 라운드당 플래너 웨이브 상한
  graph_backend: "memory"      # memory | neo4j (탐색 그래프 저장소; neo4j면 아래 neo4j 섹션)

# ===== Neo4j (attack.graph_backend=neo4j 일 때만) =====
# 병렬 워커 탐색 그래프 영속화. VM-A 로컬 Neo4j 권장. memory 백엔드면 이 섹션 무시됨.
neo4j:
  uri: "bolt://127.0.0.1:7687"
  user: "neo4j"
  password: ""               # 반드시 설정(set-initial-password로 정한 값)
  # database: "neo4j"        # Community면 보통 생략

# ===== VMware 스냅샷 제어 =====
# Workstation 권장: method=agent. 이유 — vmrun 스냅샷은 SSH로 되지만 revert 후 VM '재개'는
# 호스트 데스크톱 세션이 필요해 SSH로는 실패한다. 그래서 호스트 데스크톱 세션에서
# host/snapshot_agent.py 를 띄우고 VM C는 HTTP로 위임한다.
vmware:
  method: "agent"               # agent(권장·Workstation) | vmrun(SSH) | govc(ESXi/vCenter)
  target_vm_name: "VM-B-target" # govc 전용(VM 이름)
  vcenter_or_esxi: "HOST"       # govc 전용(GOVC_URL)
  baseline_snapshot: "clean-baseline"
  # ── 호스트 스냅샷 에이전트 (method=agent) ──
  # 호스트에서:  python host\snapshot_agent.py --vmx "<VM B .vmx>" --vmrun "<vmrun.exe>" --port 8010
  snapshot_agent_url: "http://192.168.16.1:8010"   # 호스트 VMnet8 IP:포트
  # ── vmrun(SSH) 전용 (method=vmrun, 비권장 — 재개 불가) ──
  vmx_path: 'C:\Users\you\Documents\Virtual Machines\VM-B\VM-B.vmx'  # 호스트의 VM B .vmx 경로
  ssh_target: "you@192.168.16.1"   # VM C→Windows 호스트 SSH (호스트 VMnet8 IP). 비우면 로컬 vmrun
  vmrun_path: "vmrun"              # PATH에 없으면 전체 경로로
  ssh_opts: ""                     # 예: "-i /home/vmc/.ssh/id_host"

# ===== 실험 파라미터 (아직 미확정 — 개발하며 튜닝) =====
experiment:
  time_limit_sec: 300           # 턴당 제한 시간 T (공수 공통)
  max_rounds: 20                # 에피소드당 최대 라운드
  episodes: 50                  # 반복 에피소드 수 (통계용)
  n_consecutive_defense: 3      # N라운드 연속 방어 성공 시 종료

# ===== 플래그 형식 (공격자에게 알려주는 것) =====
flags:
  format: "FLAG{...}"           # 값 기반 플래그 형식 (값·위치는 비공개)

# ===== 관측 (VM C가 god-view로 직접 읽는 로그) =====
observability:
  audit_log_path: "/var/lib/rancher/k3s/server/logs/audit.log"  # k3s 감사로그
  falco_log_path: "/var/log/falco/events.txt"                   # Falco file_output 경로
  # [Phase A] 취약 서비스 파드 stdout(JSON 앱 감사 로그) 동기 파일 — vmc-sync-applog.sh 가 생성.
  app_log_path: "/home/vm-c/capstone/logs/vmb-applog.log"       # AppLogSource 가 웹 공격(SQLi/SSRF/cmdi/cred-leak) 판정
  # 주의: VM C가 이 경로를 읽을 수 있어야 함(관리망 마운트/동기). 공격받는 VM B 안 거침.
