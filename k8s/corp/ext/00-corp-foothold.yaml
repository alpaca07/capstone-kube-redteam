# corp 공격 발판 — corp-ext(zone:ext)에 앉아 유일 진입점 WAF 로 나간다.
# ShopFlow frontend 발판(k8s/killchain/00-attacker-foothold.yaml)의 corp 판.
#   하네스는 VM A(클러스터 밖)에서 corp-foothold-sa 토큰으로 kubectl exec 해 이 파드 '안'에서
#   명령 실행(KubectlExecRunner namespace=corp-ext pod_ref=deploy/corp-attacker-foothold).
# 네트워크: corp-ext → WAF(corp-dmz) 만 열림(일방향 킬체인). corp-internal·corp-crown 은
#   발판에서 직접 못 감 — 1차 범위=발판→WAF→Tomcat/Solr(wget). 깊은 피벗은 corp 실행모델 별도.
# 도구: postgres:16-alpine 재사용(wget·psql·nc). Samba(smbclient)·Redis(redis-cli)는 측면이동 단계에 이미지 보강.
# ※ in-pod K8s API 토큰 미마운트(automountServiceAccountToken: false)·recon 권한 없음 — 순수 네트워크 발판.
#   corp 는 네트워크 피벗 시나리오라, API 정찰이 공격자를 K8s Secret 열거 데드엔드로 유인했음(10R 검증서 확인).
#   ShopFlow 발판은 그대로(API 정찰 취약점은 거기 유지).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: corp-foothold-sa
  namespace: corp-ext
  labels: { app.kubernetes.io/part-of: capstone-corp, role: attacker-foothold }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: corp-foothold-exec
  namespace: corp-ext                 # corp-ext 한정 exec (frontend 발판과 동일한 최소 권한)
  labels: { app.kubernetes.io/part-of: capstone-corp }
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: corp-foothold-exec
  namespace: corp-ext
  labels: { app.kubernetes.io/part-of: capstone-corp }
subjects:
  - kind: ServiceAccount
    name: corp-foothold-sa
    namespace: corp-ext
roleRef:
  kind: Role
  name: corp-foothold-exec
  apiGroup: rbac.authorization.k8s.io
# (recon ClusterRole 제거됨 — 위 헤더 ※ 참고. 과거 버전은 git 이력에 보존.)
---
apiVersion: v1
kind: Secret
metadata:
  name: corp-foothold-sa-token
  namespace: corp-ext
  labels: { app.kubernetes.io/part-of: capstone-corp }
  annotations:
    kubernetes.io/service-account.name: corp-foothold-sa
type: kubernetes.io/service-account-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: corp-attacker-foothold
  namespace: corp-ext
  labels: { app: corp-attacker-foothold, app.kubernetes.io/part-of: capstone-corp, zone: ext }
spec:
  replicas: 1
  selector:
    matchLabels: { app: corp-attacker-foothold }
  template:
    metadata:
      labels: { app: corp-attacker-foothold, zone: ext }   # zone:ext — WAF ingress(allow-from-ext) 매칭
    spec:
      serviceAccountName: corp-foothold-sa     # 하네스 exec 용 SA(corp-ext exec 전용) — 기본 SA 아님
      automountServiceAccountToken: false      # in-pod 토큰 미마운트 → 공격자가 K8s API 못 씀(네트워크 체인 강제). exec 는 외부 kubeconfig 라 무관
      containers:
        - name: toolkit
          image: postgres:16-alpine          # wget·psql·nc 내장 — ShopFlow 발판과 동일 재사용
          imagePullPolicy: IfNotPresent
          env:
            # corp-dmz 진입점 단서 — 공격자 정찰(env|grep url/internal)에 노출. ShopFlow internal-wiki 런북 역할.
            # WHERE(WAF 경유 진입)만 흘린다. HOW(WAF 우회·Tomcat PUT 웹셸·Solr Log4Shell)는 그대로 자율 과제.
            - { name: INTERNAL_APP_URL,  value: "http://waf.corp-dmz.svc.cluster.local" }
            - { name: INTERNAL_APP_NOTE, value: "legacy Tomcat 8.5 app, reachable only via WAF proxy" }
          command: ["sh", "-c"]
          # 재기동 생존: 라이브 패치였던 curl·python3 를 매니페스트에 고정(Tomcat PUT·Log4Shell 콜백용).
          args:
            - |
              apk add --no-cache curl python3 || true
              exec tail -f /dev/null
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
