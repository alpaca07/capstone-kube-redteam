# corp DMZ — 취약 WAF (ModSecurity + CRS 3.3.0 룰)
# 이미지는 waf-vuln/Dockerfile 로 VM B 에서 로컬 빌드 → k3s containerd 로 적재한다:
#   cd k8s/corp/dmz/waf-vuln
#   podman build -t localhost/corp-waf:vuln .
#   podman save localhost/corp-waf:vuln -o /tmp/corp-waf.tar
#   sudo k3s ctr images import /tmp/corp-waf.tar
# corp-ext → WAF → Tomcat/Solr (유일 진입점). server 블록 설정은 nginx 템플릿 경로로 주입.
# IDS(Suricata) 사이드카는 2단계로 분리 — 이전 사이드카 포함 버전은 git 커밋 82c43c8 에 보존.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: waf-nginx-conf
  namespace: corp-dmz
data:
  default.conf.template: |
    server {
        listen 8080;
        server_name _;

        # ModSecurity(+CRS 3.3.0)는 이미지가 상위(http) 수준에서 켠다 — 이 블록은 프록시만.
        location /solr/ {
            proxy_pass http://solr:8983;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location / {
            proxy_pass http://tomcat:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf
  namespace: corp-dmz
  labels: { app: waf, zone: dmz, role: defense-appliance }
spec:
  replicas: 1
  selector:
    matchLabels: { app: waf }
  template:
    metadata:
      labels: { app: waf, zone: dmz, role: defense-appliance }
    spec:
      containers:
        - name: waf
          image: localhost/corp-waf:vuln     # waf-vuln/Dockerfile 로 로컬 빌드 후 k3s ctr import
          imagePullPolicy: Never             # 로컬 이미지만 사용(레지스트리 조회 안 함)
          env:
            - { name: MODSEC_RULE_ENGINE, value: "On" }   # 엔진 On — 취약 룰(3.3.0)로 검사
            - { name: PORT, value: "8080" }
            # CRS 911100(메서드 enforcement) 허용목록에 PUT 추가 — 메서드 자체는 통과시키되
            # 바디 검사 룰(932/933/944)은 그대로 둔다(= 우회는 공격자 자율 과제). 라이브 패치를 매니페스트에 고정.
            - { name: ALLOWED_METHODS, value: "GET HEAD POST OPTIONS PUT" }
          ports:
            - { containerPort: 8080 }
          volumeMounts:
            - name: nginx-template
              mountPath: /etc/nginx/templates/conf.d/default.conf.template
              subPath: default.conf.template
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: nginx-template
          configMap: { name: waf-nginx-conf }
---
apiVersion: v1
kind: Service
metadata:
  name: waf
  namespace: corp-dmz
  labels: { app: waf }
spec:
  selector: { app: waf }
  ports:
    - { name: http, port: 80, targetPort: 8080 }
