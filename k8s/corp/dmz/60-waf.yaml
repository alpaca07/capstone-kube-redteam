# corp DMZ — 취약 WAF (ModSecurity + CRS 3.3.0 룰)
# 이미지는 waf-vuln/Dockerfile 로 VM B 에서 로컬 빌드 → k3s containerd 로 적재한다:
#   cd k8s/corp/dmz/waf-vuln
#   podman build -t localhost/corp-waf:vuln .
#   podman save localhost/corp-waf:vuln -o /tmp/corp-waf.tar
#   sudo k3s ctr images import /tmp/corp-waf.tar
# corp-ext → WAF → Tomcat/Solr (유일 진입점). server 블록 설정은 nginx 템플릿 경로로 주입.
# IDS(Suricata) 사이드카는 2단계로 분리 — 이전 사이드카 포함 버전은 git 커밋 82c43c8 에 보존.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: waf-nginx-conf
  namespace: corp-dmz
data:
  # log_format 지시어는 http 스코프 필수 — /etc/nginx/conf.d/00-log-format.conf 에 마운트.
  # OWASP ModSecurity Nginx 이미지의 /etc/nginx/nginx.conf 가 http {} 안에서
  # `include /etc/nginx/conf.d/*.conf;` 하므로 server {} 보다 먼저 로드되어 참조 가능.
  # 이 JSON 포맷은 common.app_signals.map_app_event 가 파싱하는 포맷과 일치 —
  # src:"app" + svc:"waf" + path + query 로 corp 킬체인 webshell cmd= 식별.
  log-format.conf: |
    log_format json_audit escape=json
      '{"ts":"$time_iso8601","src":"app","svc":"waf","path":"$uri","query":"$args",'
      '"status":$status,"method":"$request_method","remote":"$remote_addr"}';
  default.conf.template: |
    server {
        listen 8080;
        server_name _;

        # ModSecurity(+CRS 3.3.0)는 이미지가 상위(http) 수준에서 켠다 — 이 블록은 프록시만.
        #
        # ── upstream DNS 재해결 ──────────────────────────────────────────────
        # 기본 proxy_pass 는 기동 시 upstream 호스트를 '한 번만' 해결하고 그 IP를 캐시한다.
        # upstream 서비스(tomcat·solr)가 재생성돼 ClusterIP 가 바뀌면 WAF 는 옛 IP 로
        # connect() 를 시도해 'Connection refused' → 502 를 반환한다. 운영 중 Service
        # 재생성(테스트 리셋·kubectl delete 등)에도 WAF 가 자동 복구되게 다음을 쓴다:
        #   1) resolver: kube-dns 를 조회처로 지정. k3s 기본 ClusterIP 는 10.43.0.10.
        #      다른 환경이면 `kubectl get svc -n kube-system kube-dns` 로 확인해 변경.
        #      valid=10s 로 캐시 TTL 짧게, ipv6=off 로 불필요 조회 생략.
        #   2) 변수 proxy_pass: upstream 을 변수(set $..)로 두면 nginx 가 compile time 이
        #      아닌 runtime 에 해결한다 — resolver 캐시 TTL 안에서 재해결 발동.
        # 리터럴 'http://tomcat:8080' 쓰면 이 기능이 꺼져 캐시 고착된다 — 반드시 변수.
        resolver 10.43.0.10 valid=10s ipv6=off;

        # ── 앱 감사 로그(JSON) — 방어자 Observer 가 webshell cmd= 식별하는 유일한 진입점 ──
        # log_format json_audit 은 http 스코프라 /etc/nginx/conf.d/00-log-format.conf 분리.
        # vmc-sync-applog.sh 가 kubectl logs 로 수집 → cfg.observability.app_log_path 로
        # 복제 → defender Observer 가 common.app_signals.classify() 로 corp 킬체인
        # (/healthcheck.jsp?cmd=, /shell.jsp?cmd=, /scriptText) 를 WEB_CMDI 로 분류.
        access_log /dev/stdout json_audit;

        location /solr/ {
            set $solr_upstream "solr.corp-dmz.svc.cluster.local:8983";
            proxy_pass http://$solr_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location / {
            set $tomcat_upstream "tomcat.corp-dmz.svc.cluster.local:8080";
            proxy_pass http://$tomcat_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf
  namespace: corp-dmz
  labels: { app: waf, zone: dmz, role: defense-appliance }
spec:
  replicas: 1
  selector:
    matchLabels: { app: waf }
  template:
    metadata:
      labels: { app: waf, zone: dmz, role: defense-appliance }
    spec:
      containers:
        - name: waf
          image: localhost/corp-waf:vuln     # waf-vuln/Dockerfile 로 로컬 빌드 후 k3s ctr import
          imagePullPolicy: Never             # 로컬 이미지만 사용(레지스트리 조회 안 함)
          env:
            # ── 검증 모드(일시) ──────────────────────────────────────────────
            # DetectionOnly: 취약 룰(3.3.0)을 전부 검사·로깅하되 '차단은 안 함'.
            #   목적: 핑거프린트→KG→Tomcat exploit 체인이 corp-crown 까지 실제로
            #         닫히는지 end-to-end 로 확인(바디룰 932/933/944 가 가로막던 지점 개방).
            #   로그는 그대로 남으므로 무엇이 '차단될 뻔했는지'는 다 보인다(리포트 근거).
            #   ★ WAF 우회를 다시 '공격자 자율 과제'로 돌리려면 이 값만 "On" 으로. ★
            - { name: MODSEC_RULE_ENGINE, value: "DetectionOnly" }
            - { name: PORT, value: "8080" }
            # CRS 911100(메서드 enforcement) 허용목록에 PUT 추가(On 복귀 시에도 메서드는 통과).
            - { name: ALLOWED_METHODS, value: "GET HEAD POST OPTIONS PUT" }
          ports:
            - { containerPort: 8080 }
          volumeMounts:
            - name: nginx-template
              mountPath: /etc/nginx/templates/conf.d/default.conf.template
              subPath: default.conf.template
            # log_format 정의(http 스코프) — nginx.conf 의 include /etc/nginx/conf.d/*.conf
            # 로 자동 로드. envsubst 는 templates/ 디렉터리만 처리하므로 conf.d/ 직접 마운트.
            - name: nginx-template
              mountPath: /etc/nginx/conf.d/00-log-format.conf
              subPath: log-format.conf
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: nginx-template
          configMap: { name: waf-nginx-conf }
---
apiVersion: v1
kind: Service
metadata:
  name: waf
  namespace: corp-dmz
  labels: { app: waf }
spec:
  selector: { app: waf }
  ports:
    - { name: http, port: 80, targetPort: 8080 }
    # 검증 넛지: :8080 도 WAF 로 받는다. 공격자(27B)가 'Tomcat=8080' 추론으로 PUT 을 :8080 에 쏘는데
    #   WAF 서비스가 :80 만 받아 빗나감 → 웹셸이 안 올라감. 웹셸 이후 체인(피벗→crown) 검증을 위해
    #   :8080 도 같은 WAF(nginx:8080)로 받게 한다 — 둘 다 WAF 거쳐 tomcat:8080 프록시, 진입점은 WAF 단일 유지.
    #   되돌리려면 이 포트만 제거(공격자가 :80 를 스스로 쓰게 하는 게 원래 과제).
    - { name: http-alt, port: 8080, targetPort: 8080 }
