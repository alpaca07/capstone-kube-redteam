# corp DMZ — 취약 WAF (ModSecurity + CRS 3.3.0 룰)
# 이미지는 waf-vuln/Dockerfile 로 VM B 에서 로컬 빌드 → k3s containerd 로 적재한다:
#   cd k8s/corp/dmz/waf-vuln
#   podman build -t localhost/corp-waf:vuln .
#   podman save localhost/corp-waf:vuln -o /tmp/corp-waf.tar
#   sudo k3s ctr images import /tmp/corp-waf.tar
# corp-ext → WAF → Tomcat/Solr (유일 진입점). server 블록 설정은 nginx 템플릿 경로로 주입.
# IDS(Suricata) 사이드카는 2단계로 분리 — 이전 사이드카 포함 버전은 git 커밋 82c43c8 에 보존.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: waf-nginx-conf
  namespace: corp-dmz
data:
  default.conf.template: |
    server {
        listen 8080;
        server_name _;

        # ModSecurity(+CRS 3.3.0)는 이미지가 상위(http) 수준에서 켠다 — 이 블록은 프록시만.
        location /solr/ {
            proxy_pass http://solr:8983;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location / {
            proxy_pass http://tomcat:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waf
  namespace: corp-dmz
  labels: { app: waf, zone: dmz, role: defense-appliance }
spec:
  replicas: 1
  selector:
    matchLabels: { app: waf }
  template:
    metadata:
      labels: { app: waf, zone: dmz, role: defense-appliance }
    spec:
      containers:
        - name: waf
          image: localhost/corp-waf:vuln     # waf-vuln/Dockerfile 로 로컬 빌드 후 k3s ctr import
          imagePullPolicy: Never             # 로컬 이미지만 사용(레지스트리 조회 안 함)
          env:
            # ── 검증 모드(일시) ──────────────────────────────────────────────
            # DetectionOnly: 취약 룰(3.3.0)을 전부 검사·로깅하되 '차단은 안 함'.
            #   목적: 핑거프린트→KG→Tomcat exploit 체인이 corp-crown 까지 실제로
            #         닫히는지 end-to-end 로 확인(바디룰 932/933/944 가 가로막던 지점 개방).
            #   로그는 그대로 남으므로 무엇이 '차단될 뻔했는지'는 다 보인다(리포트 근거).
            #   ★ WAF 우회를 다시 '공격자 자율 과제'로 돌리려면 이 값만 "On" 으로. ★
            - { name: MODSEC_RULE_ENGINE, value: "DetectionOnly" }
            - { name: PORT, value: "8080" }
            # CRS 911100(메서드 enforcement) 허용목록에 PUT 추가(On 복귀 시에도 메서드는 통과).
            - { name: ALLOWED_METHODS, value: "GET HEAD POST OPTIONS PUT" }
          ports:
            - { containerPort: 8080 }
          volumeMounts:
            - name: nginx-template
              mountPath: /etc/nginx/templates/conf.d/default.conf.template
              subPath: default.conf.template
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: nginx-template
          configMap: { name: waf-nginx-conf }
---
apiVersion: v1
kind: Service
metadata:
  name: waf
  namespace: corp-dmz
  labels: { app: waf }
spec:
  selector: { app: waf }
  ports:
    - { name: http, port: 80, targetPort: 8080 }
