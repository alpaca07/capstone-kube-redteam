# corp 크라운 PostgreSQL 자격증명 — '약한 인증'이 취약점의 일부다.
# 수퍼유저(postgres)로 접속되므로 COPY FROM PROGRAM(OS 명령 실행)이 열린다.
# 이 패스워드는 2단계에서 corp-internal 서비스(예: Jenkins 배포 토큰·설정)로부터
# 유출되는 값과 짝지어, 공격자가 '수집 → 크라운 접속'을 밟게 만든다.
# 랩 전용 가짜 자격증명(실제 비밀 아님).
apiVersion: v1
kind: Secret
metadata:
  name: corp-postgres-credentials
  namespace: corp-crown
type: Opaque
stringData:
  POSTGRES_DB: corpdb
  POSTGRES_USER: postgres        # 수퍼유저 — COPY FROM PROGRAM 가능
  POSTGRES_PASSWORD: postgres    # 약한 패스워드 (추측·유출 대상)
