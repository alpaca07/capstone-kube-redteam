# corp 내부 — Samba 4.6.3 (CVE-2017-7494, SambaCry)
# VulHub samba/CVE-2017-7494 재현: 쓰기 가능한 게스트 공유에 악성 .so 를 올려 로드 → RCE.
# ※ 설계서엔 4.5.9로 적었으나 VulHub 공식 재현 이미지가 4.6.3이라 그걸 따른다(둘 다 취약).
apiVersion: v1
kind: ConfigMap
metadata:
  name: samba-config
  namespace: corp-internal
data:
  smb.conf: |
    [global]
        map to guest = Bad User
        server string = Samba Server Version %v
        guest account = nobody

    [myshare]
        path = /home/share
        read only = no
        guest ok = yes
        guest only = yes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: samba
  namespace: corp-internal
  labels: { app: samba, zone: internal }
spec:
  replicas: 1
  selector:
    matchLabels: { app: samba }
  template:
    metadata:
      labels: { app: samba, zone: internal }
    spec:
      containers:
        - name: samba
          image: vulhub/samba:4.6.3
          stdin: true
          tty: true
          ports:
            - { containerPort: 445 }
            - { containerPort: 6699 }
          volumeMounts:
            - name: config
              mountPath: /usr/local/samba/etc/smb.conf
              subPath: smb.conf
          readinessProbe:
            tcpSocket: { port: 445 }
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          configMap: { name: samba-config }
---
apiVersion: v1
kind: Service
metadata:
  name: samba
  namespace: corp-internal
  labels: { app: samba }
spec:
  selector: { app: samba }
  ports:
    - { name: smb, port: 445, targetPort: 445 }
    - { name: exploit, port: 6699, targetPort: 6699 }
