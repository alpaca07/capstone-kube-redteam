# corp 내부 — Redis 4.0.14 무인증 (VulHub redis/4-unacc 재현)
# 인증 없이 열려 있어 MODULE LOAD, 또는 config set dir + dbfilename 로 RCE / 세션·캐시 열람.
# vulhub/redis:4.0.14 이미지가 bind 0.0.0.0 + protected-mode no 로 빌드돼 있다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: corp-internal
  labels: { app: redis, zone: internal }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis, zone: internal }
    spec:
      containers:
        - name: redis
          image: vulhub/redis:4.0.14
          ports:
            - { containerPort: 6379 }
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: corp-internal
  labels: { app: redis }
spec:
  selector: { app: redis }
  ports:
    - { port: 6379, targetPort: 6379 }
