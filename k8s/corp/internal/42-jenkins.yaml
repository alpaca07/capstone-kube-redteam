# corp 내부 — Jenkins 2.138 (CVE-2018-1000861) + 배포 자격증명 보관
# VulHub jenkins/CVE-2018-1000861 재현: Stapler URL 라우팅으로 인증 전 코드실행 → 스크립트 콘솔.
# 공격자는 여기서 아래 배포 접속정보를 읽어 '자격증명 수집 → 크라운'을 잇는다(통과 ②).
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-deploy-creds
  namespace: corp-internal
data:
  # 야간 DB 동기화 잡이 쓰는 접속정보 — corp-crown PostgreSQL 로 이어진다.
  # 값은 corp-crown/10-postgres-secret.yaml 과 일치(수집 → 크라운 접속 성립).
  corp-db.properties: |
    CORP_DB_HOST=postgres.corp-crown.svc.cluster.local
    CORP_DB_PORT=5432
    CORP_DB_USER=corp_svc
    CORP_DB_PASS=K7mNx2vP9qLr4aZ8
    CORP_DB_NAME=corpdb
---
# 운영팀 야간잡 상비 스크립트 — crown DB 상태 확인용 Groovy. 공격자 관점에선
# '사전배치 자원' 으로 공개되어 Jenkins Script Console 에서 evaluate 가능.
# postgres JDBC(/var/jenkins_home/.groovy/lib/postgresql.jar) 를 URLClassLoader 로
# 로드해 corp-crown/postgres 에 직접 접속 → customers SELECT.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-ops-payload
  namespace: corp-internal
data:
  crown-read.groovy: |
    // /opt/deploy/corp-db.properties 에서 자격증명 로드 — 하드코딩 금지(자격증명 랜덤화 대응)
    def creds = [:]
    new File('/opt/deploy/corp-db.properties').eachLine { line ->
        def m = line =~ /^([A-Z_]+)=(.+)$/
        if (m) creds[m[0][1].trim()] = m[0][2].trim()
    }
    def jar = new File('/var/jenkins_home/.groovy/lib/postgresql.jar')
    def cl = new java.net.URLClassLoader([jar.toURI().toURL()] as java.net.URL[], Thread.currentThread().contextClassLoader)
    def driver = cl.loadClass('org.postgresql.Driver').newInstance()
    def props = new java.util.Properties()
    props.setProperty('user', creds.CORP_DB_USER)
    props.setProperty('password', creds.CORP_DB_PASS)
    def url = "jdbc:postgresql://${creds.CORP_DB_HOST}:${creds.CORP_DB_PORT}/${creds.CORP_DB_NAME}"
    def conn = driver.connect(url, props)
    def rs = conn.createStatement().executeQuery('SELECT * FROM customers LIMIT 10')
    def md = rs.metaData
    def cols = (1..md.columnCount).collect { md.getColumnName(it) }
    println 'CROWN_COLS:' + cols.join(',')
    while (rs.next()) {
        println 'CROWN_ROW:' + (1..md.columnCount).collect { rs.getString(it) }.join('|')
    }
    conn.close()
  # ops_secrets 테이블 반출 전용 — customers(crown-pii)와 대칭 구조. 동일한 자격증명 로드
  # 흐름을 그대로 재사용해 운영 비밀(key/value/note)을 반환한다. 두 크라운 자산(customers_pii,
  # ops_secrets)은 서로 다른 테이블이라 한 쿼리로 묶지 않고 wrapper 를 분리 — 공격자가 자산별로
  # '의도적으로 두 wrapper 를 호출'하도록 설계(한 번에 둘 다 반출되는 치트 방지).
  # /usr/local/bin/crown-read-ops wrapper 가 Jenkins /scriptText 로 evaluate 호출한다.
  crown-read-ops.groovy: |
    // /opt/deploy/corp-db.properties 에서 자격증명 로드 — crown-read.groovy 와 동일 패턴
    def creds = [:]
    new File('/opt/deploy/corp-db.properties').eachLine { line ->
        def m = line =~ /^([A-Z_]+)=(.+)$/
        if (m) creds[m[0][1].trim()] = m[0][2].trim()
    }
    def jar = new File('/var/jenkins_home/.groovy/lib/postgresql.jar')
    def cl = new java.net.URLClassLoader([jar.toURI().toURL()] as java.net.URL[], Thread.currentThread().contextClassLoader)
    def driver = cl.loadClass('org.postgresql.Driver').newInstance()
    def props = new java.util.Properties()
    props.setProperty('user', creds.CORP_DB_USER)
    props.setProperty('password', creds.CORP_DB_PASS)
    def url = "jdbc:postgresql://${creds.CORP_DB_HOST}:${creds.CORP_DB_PORT}/${creds.CORP_DB_NAME}"
    def conn = driver.connect(url, props)
    def rs = conn.createStatement().executeQuery('SELECT * FROM ops_secrets LIMIT 10')
    def md = rs.metaData
    def cols = (1..md.columnCount).collect { md.getColumnName(it) }
    println 'OPS_COLS:' + cols.join(',')
    while (rs.next()) {
        println 'OPS_ROW:' + (1..md.columnCount).collect { rs.getString(it) }.join('|')
    }
    conn.close()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: corp-internal
  labels: { app: jenkins, zone: internal }
spec:
  replicas: 1
  selector:
    matchLabels: { app: jenkins }
  template:
    metadata:
      labels: { app: jenkins, zone: internal }
    spec:
      # Jenkins 가 쓰는 postgres JDBC 드라이버를 Pod 기동 전에 /var/jenkins_home/.groovy/lib/
      # 에 영구 배치 — Pod 재시작마다 수동 kubectl cp 없이도 crown-read.groovy 가 작동.
      # 실제 운영에서도 야간잡 상비 드라이버는 사전배치가 표준.
      initContainers:
        - name: postgres-jar-fetch
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              wget -q -O /jars/postgresql.jar \
                https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.3/postgresql-42.7.3.jar \
                && echo "postgresql.jar fetched: $(ls -la /jars/postgresql.jar)" \
                || { echo "wget failed"; exit 1; }
          volumeMounts:
            - name: postgres-jar
              mountPath: /jars
      containers:
        - name: jenkins
          image: vulhub/jenkins:2.138
          ports:
            - { containerPort: 8080 }
            - { containerPort: 50000 }
          volumeMounts:
            - name: deploy-creds
              mountPath: /opt/deploy
              readOnly: true
            - name: ops-payload
              mountPath: /opt/payload
              readOnly: true
            - name: postgres-jar
              mountPath: /var/jenkins_home/.groovy/lib
              readOnly: true
          readinessProbe:
            httpGet: { path: /login, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 12
      volumes:
        - name: deploy-creds
          configMap: { name: jenkins-deploy-creds }
        - name: ops-payload
          configMap: { name: jenkins-ops-payload }
        - name: postgres-jar
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: corp-internal
  labels: { app: jenkins }
spec:
  selector: { app: jenkins }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
    - { name: agent, port: 50000, targetPort: 50000 }
