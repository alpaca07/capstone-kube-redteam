# 더미 트래픽 생성기 — 여러 서비스를 주기 호출. 가용성 baseline + 배경 노이즈.
# 방어 패치가 서비스를 깨뜨리면 해당 서비스 코드가 non-200으로 찍혀 감지됨.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: frontend
  labels: { app: traffic-generator, tier: ops }
spec:
  replicas: 1
  selector:
    matchLabels: { app: traffic-generator }
  template:
    metadata:
      labels: { app: traffic-generator, tier: ops }
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "traffic-generator start"
              hit(){ curl -s -m 5 -o /dev/null -w "%{http_code}" "$1"; }
              while true; do
                sf=$(hit "http://storefront.frontend.svc.cluster.local/api/products")
                cp=$(hit "http://customer-portal.frontend.svc.cluster.local/")
                oa=$(hit "http://order-api.backend.svc.cluster.local:8080/api/orders")
                ad=$(hit "http://admin-dashboard.internal.svc.cluster.local:8080/api/stats")
                echo "$(date -u +%H:%M:%S) store=$sf portal=$cp orders=$oa admin=$ad"
                sleep 5
              done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
