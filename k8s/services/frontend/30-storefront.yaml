# storefront — 쇼핑몰 메인 (frontend ns, 공개). catalog-api/order-api로 프록시. NodePort 30080.
apiVersion: v1
kind: ConfigMap
metadata:
  name: storefront-web
  namespace: frontend
data:
  default.conf: |
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;
        location /api/products { proxy_pass http://catalog-api.backend.svc.cluster.local:8080; }
        location /api/orders   { proxy_pass http://order-api.backend.svc.cluster.local:8080; }
        location / { try_files $uri $uri/ /index.html; }
    }
  index.html: |
    <!doctype html><html lang="ko"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"><title>ShopFlow</title>
    <style>
      body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#222}
      header{background:#16a34a;color:#fff;padding:16px 24px;font-size:21px;font-weight:800}
      .wrap{max-width:1000px;margin:24px auto;padding:0 16px}
      h2{font-size:16px;color:#444}
      .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
      .card{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
      .cat{font-size:11px;color:#16a34a;font-weight:700;text-transform:uppercase}
      .name{font-size:15px;font-weight:700;margin:5px 0}
      .price{font-size:17px;font-weight:800}
      .stock{font-size:12px;color:#888;margin-top:4px}
    </style></head><body>
    <header>ShopFlow 쇼핑몰</header>
    <div class="wrap">
      <h2>전체 상품</h2>
      <div class="grid" id="grid">불러오는 중…</div>
    </div>
    <script>
      fetch('/api/products').then(r=>r.json()).then(ps=>{
        const g=document.getElementById('grid');g.innerHTML='';
        for(const p of ps){
          const d=document.createElement('div');d.className='card';
          d.innerHTML=`<div class="cat">${p.category}</div><div class="name">${p.name}</div>
            <div class="price">₩${p.price.toLocaleString()}</div><div class="stock">재고 ${p.stock}개</div>`;
          g.appendChild(d);
        }
      }).catch(()=>{document.getElementById('grid').innerHTML='상품 로드 실패';});
    </script></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: frontend
  labels: { app: storefront, tier: frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: storefront }
  template:
    metadata:
      labels: { app: storefront, tier: frontend }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          volumeMounts:
            - { name: web, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
            - { name: web, mountPath: /usr/share/nginx/html/index.html, subPath: index.html }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: web
          configMap: { name: storefront-web }
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: frontend
  labels: { app: storefront }
spec:
  type: NodePort
  selector: { app: storefront }
  ports: [{ port: 80, targetPort: 80, nodePort: 30080 }]
