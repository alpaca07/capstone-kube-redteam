# nginx 프론트엔드 (frontend 네임스페이스) — 외부 접근용 NodePort 30080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-web
  namespace: frontend
  labels:
    app: frontend-web
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-web
  template:
    metadata:
      labels:
        app: frontend-web
        tier: frontend
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: web
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: web
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: web
          configMap:
            name: frontend-web
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-web
  namespace: frontend
  labels:
    app: frontend-web
spec:
  type: NodePort
  selector:
    app: frontend-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
