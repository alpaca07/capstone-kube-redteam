# 웹앱(frontend ns)이 DB에 붙기 위한 연결정보.
# Secret은 네임스페이스 스코프라, database ns의 postgres-credentials를 그대로 못 씀 → frontend ns에 연결정보를 둔다.
# 2단계: 정상적으로 env(Secret) 주입. 3단계에서 이걸 소스에 하드코딩/디버그노출하는 게 ① 취약점.
apiVersion: v1
kind: Secret
metadata:
  name: db-connection
  namespace: frontend
type: Opaque
stringData:
  DB_HOST: postgres.database.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: customerdb
  DB_USER: appuser
  DB_PASSWORD: devpassword123
