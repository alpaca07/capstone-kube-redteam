# backend ns 공통 설정 — DB 연결(Secret) + Redis 주소(ConfigMap)
# 2단계: 정상적으로 Secret/env 주입. 3단계에서 이 크레덴셜을 어딘가에 평문 노출시키는 게 ①.
apiVersion: v1
kind: Secret
metadata:
  name: db-connection
  namespace: backend
type: Opaque
stringData:
  DB_HOST: postgres.database.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: customerdb
  # 앱 전용 제한 role(shopflow_app) — superuser(appuser) 아님. god-view actor 스코핑이 앱 조회를
  # 크라운에서 빼는 전제: 공격자가 ②(appuser)·①(legacy_admin)로 얻는 role 과 '달라야' 한다.
  DB_USER: shopflow_app
  DB_PASSWORD: Sh0pFl0wApp!svc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: backend
data:
  REDIS_HOST: redis.database.svc.cluster.local
  REDIS_PORT: "6379"
