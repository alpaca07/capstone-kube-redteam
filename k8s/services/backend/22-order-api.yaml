# order-api — 주문 (backend ns). orders + customers + products 조인 조회.
# [Phase A] B0 cred-leak(/debug/config). [Tier B] B1 BOLA(/api/invoice/<id>) · B3 mass-assign(/api/account/update).
# 방어자 하드닝 변종: k8s/killchain/defense-reference/app-hardened/order-api-code.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-api-code
  namespace: backend
data:
  app.py: |
    import os, json
    from datetime import datetime, timezone
    from flask import Flask, jsonify, request, abort
    import psycopg2, psycopg2.extras
    app = Flask(__name__)
    @app.after_request
    def _audit(resp):
        # 앱 감사 로그(god-view AppLogSource). /debug/config→WEB_CREDLEAK · /api/invoice/→WEB_BOLA ·
        # /api/account/update(fields)→WEB_MASSASSIGN.
        try:
            if request.path != "/health":
                rec = {"ts": datetime.now(timezone.utc).isoformat(), "src": "app",
                       "svc": "order-api", "path": request.path,
                       "query": request.query_string.decode("utf-8", "replace"),
                       "status": resp.status_code}
                f = request.environ.get("capstone.fields")
                if f is not None:
                    rec["fields"] = f
                print(json.dumps(rec), flush=True)
                cr = request.environ.get("capstone.crown")
                if cr is not None:
                    print(json.dumps({"ts": rec["ts"], "src": "app", "svc": rec["svc"],
                                      "event": "crown_exfil", "target": cr,
                                      "via": request.path, "status": resp.status_code}),
                          flush=True)
        except Exception:
            pass
        return resp
    def _crown_of(cur, rows):
        # 크라운 반출 자백(god-view): 실행된 실제 쿼리가 민감 데이터를 읽어 행을 돌려줬나.
        # 플래그 문자열이 아니라 '접근 흔적'으로 판정 — internal_secrets 접근(정상 앱은 미접근) 또는
        # PII 컬럼(ssn/email/phone/address) 반환. invoice(BOLA) 에서만 호출(account_update 오탐 방지).
        if not rows:            # fetch 결과가 실제로 있을 때만(rowcount 는 execute 직후 신뢰 불가)
            return None
        try:
            q = (cur.query or b"").decode("utf-8", "replace").lower()
        except Exception:
            return None
        if "internal_secrets" in q:
            return "internal_secrets"
        if any(col in q for col in ("ssn", "email", "phone", "address")):
            return "customers_pii"
        return None
    def conn():
        return psycopg2.connect(host=os.environ["DB_HOST"], port=os.environ.get("DB_PORT","5432"),
            dbname=os.environ["DB_NAME"], user=os.environ["DB_USER"],
            password=os.environ["DB_PASSWORD"], connect_timeout=5)
    @app.get("/health")
    def health():
        try:
            with conn() as c, c.cursor() as cur: cur.execute("SELECT 1")
            return {"status": "ok"}
        except Exception as e:
            return {"status": "error", "detail": str(e)}, 500
    @app.get("/api/orders")
    def orders():
        with conn() as c, c.cursor(cursor_factory=psycopg2.extras.RealDictCursor) as cur:
            cur.execute("SELECT o.id, c.name AS customer, p.name AS product, o.qty, o.status, o.created_at "
                        "FROM orders o JOIN customers c ON o.customer_id=c.id "
                        "JOIN products p ON o.product_id=p.id ORDER BY o.id")
            return jsonify(cur.fetchall())
    @app.get("/api/orders/customer/<int:cid>")
    def by_customer(cid):
        with conn() as c, c.cursor(cursor_factory=psycopg2.extras.RealDictCursor) as cur:
            cur.execute("SELECT o.id, p.name AS product, o.qty, o.status, o.created_at "
                        "FROM orders o JOIN products p ON o.product_id=p.id "
                        "WHERE o.customer_id=%s ORDER BY o.id", (cid,))
            return jsonify(cur.fetchall())
    @app.get("/debug/config")
    def debug_config():
        # ⚠ B0 cred-leak: env 평문 노출(DB_PASSWORD 등) → ① 대체경로.
        return jsonify({k: v for k, v in os.environ.items()})
    @app.get("/api/invoice/<int:oid>")
    def invoice(oid):
        # 주문 영수증 상세 — 주문 id 로 조회.
        # ⚠ B1 BOLA/IDOR: 인증·소유자 검사 없음. oid 만 바꾸면 '타 고객'의 PII(ssn 포함)가 다 나온다.
        with conn() as c, c.cursor(cursor_factory=psycopg2.extras.RealDictCursor) as cur:
            cur.execute("SELECT o.id, o.status, o.qty, o.created_at, p.name AS product, p.price, "
                        "cu.name AS customer, cu.email, cu.phone, cu.address, cu.ssn "
                        "FROM orders o JOIN products p ON o.product_id=p.id "
                        "JOIN customers cu ON o.customer_id=cu.id WHERE o.id=%s", (oid,))
            r = cur.fetchone()
            request.environ["capstone.crown"] = _crown_of(cur, r)   # 자백: PII(ssn 등) 반환됐나(BOLA, fetch 후)
            if not r:
                abort(404)
            return jsonify(r)
    @app.post("/api/account/update")
    def account_update():
        # 프로필 수정 — JSON 필드를 customers 에 반영(id 또는 email 로 대상 지정).
        # ⚠ B3 Mass Assignment: 허용 필드 화이트리스트가 없어 role/tier 까지 그대로 UPDATE → 권한상승.
        data = request.get_json(silent=True) or {}
        request.environ["capstone.fields"] = ",".join(sorted(data.keys()))   # god-view 감사용
        cid = data.pop("id", None)
        email = data.pop("email", None) if cid is None else None
        cols = [k for k in data.keys() if k.isidentifier()]
        if not cols or (cid is None and email is None):
            return {"error": "id 또는 email 과 수정할 필드가 필요"}, 400
        set_sql = ", ".join(f"{k}=%s" for k in cols)          # 컬럼명 화이트리스트 없음(대량 할당)
        vals = [data[k] for k in cols]
        where, wval = ("id=%s", cid) if cid is not None else ("email=%s", email)
        with conn() as c, c.cursor(cursor_factory=psycopg2.extras.RealDictCursor) as cur:
            try:
                cur.execute(f"UPDATE customers SET {set_sql} WHERE {where} RETURNING id,name,tier,role",
                            vals + [wval])
            except Exception as e:
                return {"error": str(e)}, 400
            return jsonify({"updated": cur.fetchone()})
    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=8080)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: backend
  labels: { app: order-api, tier: backend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: order-api }
  template:
    metadata:
      labels: { app: order-api, tier: backend }
    spec:
      containers:
        - name: order-api
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args: ["pip install --no-cache-dir flask==3.0.3 psycopg2-binary==2.9.9 && python /app/app.py"]
          ports: [{ containerPort: 8080 }]
          envFrom:
            - secretRef: { name: db-connection }
          volumeMounts: [{ name: code, mountPath: /app }]
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: code
          configMap: { name: order-api-code }
---
apiVersion: v1
kind: Service
metadata:
  name: order-api
  namespace: backend
  labels: { app: order-api }
spec:
  selector: { app: order-api }
  ports: [{ port: 8080, targetPort: 8080 }]
