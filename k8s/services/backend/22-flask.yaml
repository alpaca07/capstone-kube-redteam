# Flask 백엔드 (frontend 네임스페이스 = 웹앱 파드)
# python 공식 이미지에 ConfigMap 코드 얹고, 기동 시 의존성 설치 후 실행.
# ※ 개발 단계는 pip(인터넷) 사용. 실험 전엔 진짜 이미지로 구워서 스냅샷(5단계).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: frontend
  labels:
    app: backend
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: frontend
    spec:
      containers:
        - name: backend
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --no-cache-dir flask==3.0.3 psycopg2-binary==2.9.9 && \
              python /app/app.py
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: db-connection
          volumeMounts:
            - name: code
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: code
          configMap:
            name: backend-code
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: frontend
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
