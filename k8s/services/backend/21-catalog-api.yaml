# catalog-api — 상품 카탈로그 (backend ns). postgres products 테이블 조회.
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-api-code
  namespace: backend
data:
  app.py: |
    import os
    from flask import Flask, jsonify, abort
    import psycopg2, psycopg2.extras
    app = Flask(__name__)
    def conn():
        return psycopg2.connect(host=os.environ["DB_HOST"], port=os.environ.get("DB_PORT","5432"),
            dbname=os.environ["DB_NAME"], user=os.environ["DB_USER"],
            password=os.environ["DB_PASSWORD"], connect_timeout=5)
    @app.get("/health")
    def health():
        try:
            with conn() as c, c.cursor() as cur: cur.execute("SELECT 1")
            return {"status": "ok"}
        except Exception as e:
            return {"status": "error", "detail": str(e)}, 500
    @app.get("/api/products")
    def products():
        with conn() as c, c.cursor(cursor_factory=psycopg2.extras.RealDictCursor) as cur:
            cur.execute("SELECT id,name,category,price,stock FROM products ORDER BY id")
            return jsonify(cur.fetchall())
    @app.get("/api/products/<int:pid>")
    def product(pid):
        with conn() as c, c.cursor(cursor_factory=psycopg2.extras.RealDictCursor) as cur:
            cur.execute("SELECT id,name,category,price,stock FROM products WHERE id=%s", (pid,))
            r = cur.fetchone()
            if not r: abort(404)
            return jsonify(r)
    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=8080)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: backend
  labels: { app: catalog-api, tier: backend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: catalog-api }
  template:
    metadata:
      labels: { app: catalog-api, tier: backend }
    spec:
      containers:
        - name: catalog-api
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args: ["pip install --no-cache-dir flask==3.0.3 psycopg2-binary==2.9.9 && python /app/app.py"]
          ports: [{ containerPort: 8080 }]
          envFrom:
            - secretRef: { name: db-connection }
          volumeMounts: [{ name: code, mountPath: /app }]
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: code
          configMap: { name: catalog-api-code }
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: backend
  labels: { app: catalog-api }
spec:
  selector: { app: catalog-api }
  ports: [{ port: 8080, targetPort: 8080 }]
