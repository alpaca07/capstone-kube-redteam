  03-inject-flag.sh: |
    #!/bin/sh
    # ④ FLAG 주입 — env FLAG_4(gitignore된 secret 'flag-values')에서 가져옴.
    # secret 없으면 placeholder (generate-flags.sh 실행 전). 재기동마다 재주입(리셋 친화).
    set -e
    FLAG="${FLAG_4:-FLAG{PLACEHOLDER_RUN_generate-flags_sh}}"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<EOSQL
    INSERT INTO internal_secrets (key, value, note) VALUES
     ('master_db_backup_credential', '${FLAG}', '④ 목표물 (값 기반 FLAG)')
    ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value;
    EOSQL
    if [ -n "${FLAG_4:-}" ]; then echo "flag injected from secret"; else echo "flag = placeholder (no secret yet)"; fi
