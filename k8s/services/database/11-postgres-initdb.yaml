# PostgreSQL 초기화 SQL — 이커머스 스키마 (고객·상품·주문) + FLAG
# postgres 이미지가 /docker-entrypoint-initdb.d/*.sql 을 최초 기동 시 알파벳순 실행.
# emptyDir 데이터라 파드 재시작마다 깨끗이 재초기화 → 에피소드 리셋에 유리.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: database
data:
  01-schema.sql: |
    CREATE TABLE IF NOT EXISTS customers (
      id SERIAL PRIMARY KEY, name TEXT NOT NULL, email TEXT NOT NULL,
      phone TEXT, address TEXT, ssn TEXT, tier TEXT DEFAULT 'standard',
      created_at TIMESTAMP DEFAULT now()
    );
    CREATE TABLE IF NOT EXISTS products (
      id SERIAL PRIMARY KEY, name TEXT NOT NULL, category TEXT,
      price INT NOT NULL, stock INT DEFAULT 0
    );
    CREATE TABLE IF NOT EXISTS orders (
      id SERIAL PRIMARY KEY, customer_id INT REFERENCES customers(id),
      product_id INT REFERENCES products(id), qty INT DEFAULT 1,
      status TEXT DEFAULT 'pending', created_at TIMESTAMP DEFAULT now()
    );
    -- ④ 최종 목표: 값 기반 플래그(가짜 마스터 자격증명)
    CREATE TABLE IF NOT EXISTS internal_secrets (
      id SERIAL PRIMARY KEY, key TEXT UNIQUE NOT NULL, value TEXT NOT NULL, note TEXT
    );

