# PostgreSQL 자격증명 (2단계: 정상적으로 Secret 주입)
# ※ 3단계에서 이 값들이 웹앱 소스에 '하드코딩'되는 게 킬체인 ① 취약점이 된다.
#   지금은 개발용 placeholder. 실제 랩이라 민감정보 아님(가짜 DB).
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: database
type: Opaque
stringData:
  POSTGRES_DB: customerdb
  POSTGRES_USER: appuser
  POSTGRES_PASSWORD: devpassword123
