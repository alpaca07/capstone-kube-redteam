# PostgreSQL (database 네임스페이스) — 킬체인 ④ 최종 목표
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: database
  labels:
    app: postgres
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tier: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          # [B] 직접 DB 접속 크라운 판정용 statement 로깅(god-view DbLogSource 가 kubectl logs 로 읽음).
          #   log_statement=all → 모든 SQL 을 stderr(컨테이너 stdout)로. 노이즈는 crown_of_sql 이 필터.
          #   log_line_prefix 의 %m(타임스탬프)으로 시간창, %u@%d(접속 role@db)로 actor 스코핑을 판정.
          #   → 앱(appuser)과 공격자 유출 role(legacy_admin)이 갈려 거짓 크라운 방지(attacker_db_roles).
          args:
            - "postgres"
            - "-c"
            - "log_statement=all"
            - "-c"
            - "log_line_prefix=%m [%p] %u@%d "
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: FLAG_4                    # 4단계 ④ — gitignore된 flag-values secret에서 주입
              valueFrom:
                secretKeyRef:
                  name: flag-values
                  key: FLAG_4
                  optional: true              # secret 없어도 파드 기동(그땐 placeholder)
          volumeMounts:
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: initdb
          configMap:
            name: postgres-initdb
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: database
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
