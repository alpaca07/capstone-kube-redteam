# Redis (database 네임스페이스) — 세션/캐시. 내부 캐시라 인증 없음(흔한 운영 관행).
# auth-service 세션 저장 등에 사용. 나중에 확장 취약점(무인증 접근) 무대로도 활용 가능.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: database
  labels: { app: redis, tier: database }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis, tier: database }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: database
  labels: { app: redis }
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379
