# Falco helm values — 런타임/syscall 관측 (DaemonSet).
driver:
  kind: modern_ebpf          # 커널모듈 빌드 없이 eBPF (Ubuntu 22.04 커널 5.15+ 지원)
tty: true
falco:
  json_output: true                    # JSON 출력 → 방어자 하네스가 파싱
  json_include_output_property: true
  json_include_tags_property: true
  priority: notice                     # notice 이상만 출력(노이즈 축소)
  # 기본 룰셋(falco_rules.yaml) 사용 — 셸 생성·민감파일 접근·수상한 프로세스 등 탐지.
  # 킬체인 커스텀 룰은 아래 customRules(top-level)로 추가(god-view map_falco_event 와 rule 이름 1:1).

# ── 캡스톤 킬체인 커스텀 룰 ──
customRules:
  capstone_killchain.yaml: |-
    - rule: Lateral movement to database
      desc: >-
        frontend 발판 파드에서 postgres(5432)로의 '성공한' 아웃바운드 연결 =
        킬체인 ③ 측면이동(NetworkPolicy 부재 악용). 차단된(실패) 연결은 evt.rawres 로 제외.
      condition: >-
        evt.type=connect and evt.rawres=0
        and container and k8s.ns.name=frontend and fd.sport=5432
      output: >-
        Lateral movement to DB (ns=%k8s.ns.name pod=%k8s.pod.name
        proc=%proc.name dip=%fd.sip dport=%fd.sport)
      priority: NOTICE
      tags: [network, mitre_lateral_movement, T1210]
    - rule: Credential access from foothold
      desc: >-
        frontend 발판 파드에서 HTTP 페치 도구(wget/curl) 기동 = 킬체인 ① 크레덴셜 수집
        (internal-wiki 단서·admin-dashboard Secret 을 HTTP 로 끌어오는 활동). HTTP
        페이로드는 Falco 가 못 보므로 프로세스 수준 근사 — 발판 NS 한정이라 공격자만 해당.
      condition: >-
        spawned_process and container and k8s.ns.name=frontend
        and proc.name in (wget, curl)
      output: >-
        Credential access from foothold (ns=%k8s.ns.name pod=%k8s.pod.name
        proc=%proc.name cmd=%proc.cmdline)
      priority: NOTICE
      tags: [process, mitre_credential_access, T1552]
