# Falco helm values — 런타임/syscall 관측 (DaemonSet).
driver:
  kind: modern_ebpf          # 커널모듈 빌드 없이 eBPF (Ubuntu 22.04 커널 5.15+ 지원)
tty: true
falco:
  json_output: true                    # JSON 출력 → 방어자 하네스가 파싱
  json_include_output_property: true
  json_include_tags_property: true
  priority: notice                     # notice 이상만 출력(노이즈 축소)
  # 기본 룰셋(falco_rules.yaml) 사용 — 셸 생성·민감파일 접근·수상한 프로세스 등 탐지.
  # 킬체인 커스텀 룰은 아래 customRules(top-level)로 추가(god-view map_falco_event 와 rule 이름 1:1).

# ── 캡스톤 킬체인 커스텀 룰 ──
customRules:
  capstone_killchain.yaml: |-
    - rule: Lateral movement to database
      desc: >-
        attacker-foothold 발판 파드에서 postgres(5432)로의 아웃바운드 연결 시도 =
        킬체인 ③ 측면이동. psql 등 논블로킹 connect(EINPROGRESS)도 잡으려 결과 필터 없음
        — 성공·시도 모두 포착(차단 성사 여부는 verdict 가 판정).
      condition: >-
        evt.type=connect and container
        and k8s.pod.name startswith "attacker-foothold" and fd.sport=5432
      output: >-
        Lateral movement to DB (ns=%k8s.ns.name pod=%k8s.pod.name
        proc=%proc.name dip=%fd.sip dport=%fd.sport)
      priority: NOTICE
      tags: [network, mitre_lateral_movement, T1210]
    - rule: Credential access from foothold
      desc: >-
        frontend 발판 파드에서 HTTP 페치 도구(wget/curl) 기동 = 킬체인 ① 크레덴셜 수집
        (internal-wiki 단서·admin-dashboard Secret 을 HTTP 로 끌어오는 활동). HTTP
        페이로드는 Falco 가 못 보므로 프로세스 수준 근사 — 발판 NS 한정이라 공격자만 해당.
      condition: >-
        spawned_process and container
        and k8s.pod.name startswith "attacker-foothold" and proc.name in (wget, curl)
      output: >-
        Credential access from foothold (ns=%k8s.ns.name pod=%k8s.pod.name
        proc=%proc.name cmd=%proc.cmdline)
      priority: NOTICE
      tags: [process, mitre_credential_access, T1552]
    # ── [Wave1] 컨테이너 탈출 (T1611 Escape to Host) ──
    - rule: Escape to host filesystem
      desc: >-
        컨테이너가 노드 루트를 hostPath 로 마운트한 /host 하위의 '호스트' 민감파일을 읽음 =
        T1611 호스트 탈출. 공격자가 배포한 privileged/hostPath 파드(attack-reference/escape-pod)
        가 /host/etc/shadow·admin.conf 등을 읽을 때 포착. 정상 워크로드는 /host 프리픽스를 쓰지
        않으므로(공격자 규약) 공격 신호로 결정적. 파일 read 레벨 포착이라 성공·시도 모두 잡힌다.
      condition: >-
        open_read and container
        and (fd.name startswith "/host/etc" or fd.name startswith "/host/root"
             or fd.name startswith "/host/var/lib/kubelet" or fd.name startswith "/host/proc/1")
      output: >-
        Host filesystem escape (file=%fd.name ns=%k8s.ns.name pod=%k8s.pod.name
        proc=%proc.name)
      priority: WARNING
      tags: [filesystem, mitre_escape_to_host, T1611]
    # ── [Wave1] 네트워크 서비스 탐색 (T1046 Network Service Discovery) ──
    - rule: Port scan from foothold
      desc: >-
        attacker-foothold 발판에서 포트 스캐너(nc/ncat/nmap/masscan) 기동 = T1046 네트워크
        서비스 탐색. 발판 NS 한정이라 공격자만 해당. Discovery 는 'detect-only'(전용 차단 패치
        없음) — 방어자는 보고만 하고 과잉 패치하지 않는 게 정답(정밀도 신호).
      condition: >-
        spawned_process and container
        and k8s.pod.name startswith "attacker-foothold"
        and proc.name in (nc, ncat, nmap, masscan)
      output: >-
        Port scan from foothold (ns=%k8s.ns.name pod=%k8s.pod.name
        proc=%proc.name cmd=%proc.cmdline)
      priority: NOTICE
      tags: [network, mitre_network_service_discovery, T1046]
    # ── [가] 권한상승 익스플로잇 (T1068) — 핵심층 privesc-container 절차 관측화 ──
    - rule: Privilege escalation in container
      desc: >-
        공격자 파드가 컨테이너 경계를 넘는 상승 행위(mount·setns·unshare syscall, nsenter) 수행 =
        T1068 권한상승 익스플로잇. 'Escape to host filesystem'(T1611, /host 파일 read)과 구분 —
        이쪽은 상승 '행위'(네임스페이스/마운트 조작), 저쪽은 호스트 파일 '열람'. 정상 워크로드는 이
        syscall 을 거의 쓰지 않으므로 공격 근사. ★VM-B 실제 privesc 시나리오 pod·syscall 에 맞춰 튜닝.
      condition: >-
        container and (evt.type in (mount, setns, unshare) or proc.name=nsenter)
        and not k8s.ns.name in (kube-system, falco, observability)
      output: >-
        Privilege escalation in container (ns=%k8s.ns.name pod=%k8s.pod.name
        proc=%proc.name evt=%evt.type)
      priority: WARNING
      tags: [process, mitre_privilege_escalation, T1068]
    # ── [가] 권한상승 제어 악용 (T1548) — 핵심층 cap-abuse 절차 관측화 ──
    - rule: Elevation control abuse
      desc: >-
        컨테이너 내 권한상승 제어 악용 — setuid syscall 호출이나 capability 조작 툴(capsh/setcap)
        실행 = T1548. 정상 워크로드엔 드문 행위라 공격 근사. ★VM-B 실제 cap-abuse 시나리오의
        setuid 바이너리·툴 집합에 맞춰 튜닝.
      condition: >-
        container and (evt.type=setuid
        or (spawned_process and proc.name in (capsh, setcap)))
      output: >-
        Elevation control abuse (ns=%k8s.ns.name pod=%k8s.pod.name
        proc=%proc.name cmd=%proc.cmdline)
      priority: WARNING
      tags: [process, mitre_abuse_elevation_control, T1548]
    # ── [사후] 리소스 탈취 (T1496 Resource Hijacking) ──
    - rule: Cryptocurrency mining in container
      desc: >-
        컨테이너에서 암호화폐 채굴 프로세스 기동 = T1496 리소스 탈취. 모델망 격리(채굴풀
        연결 불가)라 네트워크 대신 프로세스 시그니처로 포착(마이너 바이너리명·채굴 인자).
        베이스라인엔 없는 신호라 공격 결정적 — 프로세스 기동 레벨이라 크라운(실행) 달성 포착.
      condition: >-
        spawned_process and container
        and (proc.name in (xmrig, minerd, cpuminer, cpuminer-multi, ethminer, cgminer,
                           bfgminer, xmr-stak, nbminer, t-rex, phoenixminer, nanominer)
             or proc.cmdline contains "stratum+tcp"
             or proc.cmdline contains "--donate-level"
             or (proc.cmdline contains "--algo" and proc.cmdline contains "--pool"))
      output: >-
        Cryptominer launched (ns=%k8s.ns.name pod=%k8s.pod.name
        proc=%proc.name cmd=%proc.cmdline image=%container.image.repository)
      priority: CRITICAL
      tags: [process, mitre_impact, T1496]
