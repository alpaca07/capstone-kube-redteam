# DVGA (Damn Vulnerable GraphQL Application) — GraphQL 특화 취약 앱 (현대적 공격면)
#   Injection · DoS(쿼리 배칭/깊이) · 정보 노출 · Introspection 악용 등.
#   접속: http://<VM B IP>:30085   (GraphiQL IDE + /graphql 엔드포인트)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dvga
  namespace: targets
  labels: { app: dvga, app.kubernetes.io/part-of: capstone-benchmark }
spec:
  replicas: 1
  selector: { matchLabels: { app: dvga } }
  template:
    metadata:
      labels: { app: dvga, app.kubernetes.io/part-of: capstone-benchmark }
    spec:
      containers:
        - name: dvga
          image: docker.io/dolevf/dvga:latest
          ports: [{ containerPort: 5013 }]
          env:
            - { name: WEB_HOST, value: "0.0.0.0" }
            - { name: WEB_PORT, value: "5013" }
---
apiVersion: v1
kind: Service
metadata:
  name: dvga
  namespace: targets
  labels: { app: dvga }
spec:
  type: NodePort
  selector: { app: dvga }
  ports: [{ port: 5013, targetPort: 5013, nodePort: 30085 }]
