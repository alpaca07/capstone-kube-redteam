# OWASP WebGoat — Java/Spring OWASP Top 10 훈련장 (스택 다양성 확보: JVM 계열)
#   레슨 유도형이라 순수 자율 자동화엔 상대적으로 덜 맞지만 커버리지가 넓음.
#   WebWolf(공격 보조 서버) 9090 동봉.
#   접속: http://<VM B IP>:30083/WebGoat   (최초 회원가입 후 로그인)
#   WebWolf: http://<VM B IP>:30093/WebWolf
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webgoat
  namespace: targets
  labels: { app: webgoat, app.kubernetes.io/part-of: capstone-benchmark }
spec:
  replicas: 1
  selector: { matchLabels: { app: webgoat } }
  template:
    metadata:
      labels: { app: webgoat, app.kubernetes.io/part-of: capstone-benchmark }
    spec:
      containers:
        - name: webgoat
          image: docker.io/webgoat/webgoat:latest
          ports: [{ containerPort: 8080 }, { containerPort: 9090 }]
          env:
            - { name: WEBGOAT_HOST, value: "0.0.0.0" }   # 컨테이너 밖에서 접근 가능하게
            - { name: WEBWOLF_HOST, value: "0.0.0.0" }
            - { name: WEBGOAT_PORT, value: "8080" }
---
apiVersion: v1
kind: Service
metadata:
  name: webgoat
  namespace: targets
  labels: { app: webgoat }
spec:
  type: NodePort
  selector: { app: webgoat }
  ports:
    - { name: webgoat, port: 8080, targetPort: 8080, nodePort: 30083 }
    - { name: webwolf, port: 9090, targetPort: 9090, nodePort: 30093 }
