# OWASP Juice Shop — 최신 Node.js 취약 쇼핑몰 (SQLi·XSS·JWT·BOLA·NoSQLi 등 광범위)
#   ★ 내장 스코어보드 API로 '솔브 상태'를 JSON으로 노출 → god-view 결정론 채점에 직결:
#       GET http://<VM B IP>:30082/api/Challenges  → 각 챌린지 solved(true/false)
#     별도 플래그 주입 없이도 '공격 성공' 신호를 결정론적으로 받을 수 있음.
#   내부 SQLite라 외부 DB 불필요(단일 컨테이너).
#   접속: http://<VM B IP>:30082
apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: targets
  labels: { app: juice-shop, app.kubernetes.io/part-of: capstone-benchmark }
spec:
  replicas: 1
  selector: { matchLabels: { app: juice-shop } }
  template:
    metadata:
      labels: { app: juice-shop, app.kubernetes.io/part-of: capstone-benchmark }
    spec:
      containers:
        - name: juice-shop
          image: docker.io/bkimminich/juice-shop:latest
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: juice-shop
  namespace: targets
  labels: { app: juice-shop }
spec:
  type: NodePort
  selector: { app: juice-shop }
  ports: [{ port: 3000, targetPort: 3000, nodePort: 30082 }]
