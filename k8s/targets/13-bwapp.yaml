# bWAPP (buggy web application) — 100+ 취약점 카탈로그 (MITRE 커버리지 확대용 최적)
#   Apache+PHP+MySQL 올인원 컨테이너. ★ 최초 1회 DB 초기화 필요:
#       http://<VM B IP>:30084/install.php  → "here" 클릭
#   로그인: bee / bug   (좌상단에서 취약점 종류·보안레벨 선택)
#   접속: http://<VM B IP>:30084
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bwapp
  namespace: targets
  labels: { app: bwapp, app.kubernetes.io/part-of: capstone-benchmark }
spec:
  replicas: 1
  selector: { matchLabels: { app: bwapp } }
  template:
    metadata:
      labels: { app: bwapp, app.kubernetes.io/part-of: capstone-benchmark }
    spec:
      containers:
        - name: bwapp
          image: docker.io/raesene/bwapp:latest
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: bwapp
  namespace: targets
  labels: { app: bwapp }
spec:
  type: NodePort
  selector: { app: bwapp }
  ports: [{ port: 80, targetPort: 80, nodePort: 30084 }]
