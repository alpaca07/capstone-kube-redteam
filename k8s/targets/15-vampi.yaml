# VAmPI — 취약한 REST API (OWASP API Security Top 10, Flask)
#   ★ 프로젝트의 API/마이크로서비스 테마에 가장 근접한 타깃.
#   토큰 조작 · BOLA(객체 수준 인가 미흡) · 과도한 데이터 노출 · SQLi 등.
#   vulnerable=1 모드로 기동(=0 이면 안전 모드라 ablation 비교군으로도 쓸 수 있음).
#   접속: http://<VM B IP>:30086/   (Swagger UI + REST 엔드포인트)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vampi
  namespace: targets
  labels: { app: vampi, app.kubernetes.io/part-of: capstone-benchmark }
spec:
  replicas: 1
  selector: { matchLabels: { app: vampi } }
  template:
    metadata:
      labels: { app: vampi, app.kubernetes.io/part-of: capstone-benchmark }
    spec:
      containers:
        - name: vampi
          image: docker.io/erev0s/vampi:latest
          ports: [{ containerPort: 5000 }]
          env:
            - { name: vulnerable, value: "1" }
---
apiVersion: v1
kind: Service
metadata:
  name: vampi
  namespace: targets
  labels: { app: vampi }
spec:
  type: NodePort
  selector: { app: vampi }
  ports: [{ port: 5000, targetPort: 5000, nodePort: 30086 }]
