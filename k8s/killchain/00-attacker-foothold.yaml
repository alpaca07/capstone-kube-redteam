# attacker-foothold — 자동 루프용 '웹 계층 침해' 발판 (frontend ns 상주 파드).
#
# 설계 근거: 메인 킬체인 ①③④ 는 전부 .svc.cluster.local(ClusterIP) 내부 주소라 클러스터
#   '안'에서만 실행 가능하다(수동 walkthrough 도 frontend 공격자 파드에서 시작). 자동 공격
#   하네스는 VM A(클러스터 밖)에 있으므로, 명령을 이 발판 파드 안에서 kubectl exec 로 투명
#   실행해 "웹 계층이 침해된 내부 위치"를 구현한다(config attack.exec_mode=true + 아래 kubeconfig).
#
# 권한 경계(중요): 공격 하네스가 쓰는 kubeconfig 는 frontend ns 에서 '파드 exec' 만 가능
#   (secret 조회·파드 생성·타 NS 접근 불가). 즉 "웹 파드에 셸을 얻은" 수준이지 클러스터 관리자가
#   아니다 → ②(admin-sa 과권한)는 공격자가 여전히 스스로 찾아 털어야 한다(난이도 유지).
# 발판 파드 자신은 frontend 의 default SA(무권한)로 돌아 — 안에서 API 를 찔러도 기본은 막힌다.
#
# 적용/재스냅샷 절차는 foothold/README.md 참고. clean-baseline 에 이 파드가 떠 있어야 한다.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: foothold-sa
  namespace: frontend
  labels:
    app.kubernetes.io/part-of: capstone-killchain
    role: attacker-foothold
---
# frontend ns 에서 '파드 exec' 전용 Role — deploy/attacker-foothold 해석(deployments get) +
# 파드 조회(get/list) + exec(create). secret·타 NS·파드 생성 권한은 '의도적으로 없음'.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: foothold-exec
  namespace: frontend
  labels:
    app.kubernetes.io/part-of: capstone-killchain
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: foothold-exec
  namespace: frontend
  labels:
    app.kubernetes.io/part-of: capstone-killchain
subjects:
  - kind: ServiceAccount
    name: foothold-sa
    namespace: frontend
roleRef:
  kind: Role
  name: foothold-exec
  apiGroup: rbac.authorization.k8s.io
---
# 장수(비만료) SA 토큰 — gen-foothold-kubeconfig.sh 가 이 토큰으로 kubeconfig 를 만든다.
# (bound 토큰은 만료돼 실험 중 끊길 수 있어 classic token Secret 을 쓴다.)
apiVersion: v1
kind: Secret
metadata:
  name: foothold-sa-token
  namespace: frontend
  labels:
    app.kubernetes.io/part-of: capstone-killchain
  annotations:
    kubernetes.io/service-account.name: foothold-sa
type: kubernetes.io/service-account-token
---
# 발판 파드 — 유휴 파드(명령은 외부 하네스가 kubectl exec 로 주입).
# 도구 전달 = initContainer 마운트 방식: 본체 이미지(postgres:16-alpine)는 그대로 두고,
#   공격 툴킷 이미지(capstone/attacker-toolkit:1.0)를 initContainer 로 돌려 공유 볼륨 /tk 에
#   풀고, 본체가 /tk 를 마운트해 PATH·LD_LIBRARY_PATH 로 얹는다. → 발판마다 이미지 재빌드 불필요,
#   corp 등 다른 발판도 같은 블록만 붙이면 동일 툴킷. (툴킷 이미지 빌드·적재는 foothold-toolkit/)
#   도구: curl·jq·kubectl·nmap·nuclei·sqlmap·searchsploit(ExploitDB)·kdigger·deepce·amicontained
#   + 본체 내장 psql·wget·nc. 실험 중 인터넷 OFF 라 모두 이미지에 선적재(런타임 다운로드 없음)
#   → VM B containerd 에 툴킷 이미지 미리 import 필수(imagePullPolicy: IfNotPresent).
# serviceAccountName 미지정 = frontend default SA(무권한) → ② 는 공격자가 스스로 털어야.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attacker-foothold
  namespace: frontend
  labels:
    app: attacker-foothold
    app.kubernetes.io/part-of: capstone-killchain
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels: { app: attacker-foothold }
  template:
    metadata:
      labels:
        app: attacker-foothold
        app.kubernetes.io/part-of: capstone-killchain
        tier: frontend
    spec:
      initContainers:
        - name: toolkit-stage                      # 공유 툴킷을 /tk 에 풀어줌(본체 이미지 불변)
          image: capstone/attacker-toolkit:1.0     # 내가 만든 툴킷 이미지 = 도구 소스(재빌드 불필요)
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /tk/bin /tk/lib /tk/opt
              cp -a /usr/local/bin/. /tk/bin/ 2>/dev/null || true
              cp -a /usr/bin/.       /tk/bin/ 2>/dev/null || true
              cp -a /usr/lib/.       /tk/lib/ 2>/dev/null || true
              cp -a /lib/.           /tk/lib/ 2>/dev/null || true
              for d in exploitdb nuclei-templates sqlmap; do [ -e /opt/$d ] && cp -a /opt/$d /tk/opt/ || true; done
              ln -sf /tk/bin/gawk /tk/bin/awk      # 복사된 awk→/usr/bin/gawk 절대심링크를 /tk 로 교정
              printf '#!/bin/sh\nexec /tk/opt/exploitdb/searchsploit "$@"\n' > /tk/bin/searchsploit
              printf '#!/bin/sh\nexec /tk/bin/python3 /tk/opt/sqlmap/sqlmap.py "$@"\n' > /tk/bin/sqlmap
              chmod +x /tk/bin/searchsploit /tk/bin/sqlmap
          volumeMounts:
            - { name: toolkit, mountPath: /tk }
      containers:
        - name: toolkit
          image: postgres:16-alpine                # 본체는 원래 베이스 그대로(psql·wget·nc 내장)
          imagePullPolicy: IfNotPresent
          command: ["sleep", "infinity"]           # 유휴 대기(명령은 kubectl exec 로 주입)
          env:                                     # /tk 의 도구를 PATH·라이브러리에 얹음(exec 가 상속)
            - { name: PATH, value: "/tk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" }
            - { name: LD_LIBRARY_PATH, value: "/tk/lib" }
          volumeMounts:
            - { name: toolkit, mountPath: /tk, readOnly: true }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "1000m", memory: "512Mi" }   # nmap/nuclei 스파이크 여유(VM B RAM 빠듯하면 조정)
      volumes:
        - { name: toolkit, emptyDir: {} }            # initContainer 가 채우고 본체가 마운트
