# [방어 레퍼런스 · patch_app] catalog-api 하드닝 변종 (베이스라인 미적용)
#   A1 SQLi → 파라미터 바인딩 / A2 SSRF → URL allowlist(사설·내부·.svc·file 거부) / B0 → /debug/config 제거
# 적용: kubectl apply -f 이 파일 && kubectl -n backend rollout restart deploy/catalog-api
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-api-code
  namespace: backend
data:
  app.py: |
    import os, urllib.request, ipaddress, socket
    from urllib.parse import urlparse
    from flask import Flask, jsonify, request, Response, abort
    import psycopg2, psycopg2.extras
    app = Flask(__name__)
    def conn():
        return psycopg2.connect(host=os.environ["DB_HOST"], port=os.environ.get("DB_PORT","5432"),
            dbname=os.environ["DB_NAME"], user=os.environ["DB_USER"],
            password=os.environ["DB_PASSWORD"], connect_timeout=5)
    @app.get("/health")
    def health():
        try:
            with conn() as c, c.cursor() as cur: cur.execute("SELECT 1")
            return {"status": "ok"}
        except Exception as e:
            return {"status": "error", "detail": str(e)}, 500
    @app.get("/api/products")
    def products():
        q = request.args.get("q")
        with conn() as c, c.cursor(cursor_factory=psycopg2.extras.RealDictCursor) as cur:
            if q:
                # 하드닝: 파라미터 바인딩(%s) — SQLi 차단
                like = "%" + q + "%"
                cur.execute("SELECT id,name,category,price,stock FROM products "
                            "WHERE name ILIKE %s OR category ILIKE %s ORDER BY id", (like, like))
            else:
                cur.execute("SELECT id,name,category,price,stock FROM products ORDER BY id")
            return jsonify(cur.fetchall())
    @app.get("/api/products/<int:pid>")
    def product(pid):
        with conn() as c, c.cursor(cursor_factory=psycopg2.extras.RealDictCursor) as cur:
            cur.execute("SELECT id,name,category,price,stock FROM products WHERE id=%s", (pid,))
            r = cur.fetchone()
            if not r: abort(404)
            return jsonify(r)
    def _is_public_http(url):
        # 하드닝: http/https 공인 호스트만 허용 — SSRF 차단
        p = urlparse(url)
        if p.scheme not in ("http", "https"):
            return False
        host = (p.hostname or "").lower()
        if (not host or host in ("localhost", "kubernetes.default")
                or host.endswith((".svc", ".cluster.local", ".local", ".internal"))):
            return False
        try:
            infos = socket.getaddrinfo(host, p.port or (443 if p.scheme == "https" else 80))
        except Exception:
            return False
        for info in infos:
            ip = ipaddress.ip_address(info[4][0])
            if (ip.is_private or ip.is_loopback or ip.is_link_local
                    or ip.is_reserved or ip.is_multicast or ip.is_unspecified):
                return False
        return True
    @app.post("/api/products/preview")
    def preview():
        data = request.get_json(silent=True) or {}
        url = data.get("url", "")
        if not url:
            return {"error": "url required"}, 400
        if not _is_public_http(url):
            return {"error": "url not allowed"}, 403
        try:
            with urllib.request.urlopen(url, timeout=5) as resp:
                body = resp.read(65536)
                ct = resp.headers.get("Content-Type", "application/octet-stream")
            return Response(body, mimetype=ct)
        except Exception as e:
            return {"error": str(e)}, 502
    # 하드닝: /debug/config 제거 (B0 cred-leak 차단)
    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=8080)
